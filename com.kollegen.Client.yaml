app-id: dev.kollegen.client
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: kollegen-client
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
build-options:
  env:
    CARGO_HOME: /run/build/kollegen-client/cargo
    RUSTUP_HOME: /run/build/kollegen-client/rustup
    PATH: /run/build/kollegen-client/cargo/bin:/usr/bin:/bin
modules:
  - name: kollegen-client
    buildsystem: simple
    sources:
      - type: dir
        path: .
        skip:
          - target
          - node_modules
          - dist
          - .git
    build-commands:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - cargo build --release
      - install -Dm755 target/release/kollegen-client /app/bin/kollegen-client
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.kollegen.client.png
      - install -Dm644 dev.kollegen.client.desktop /app/share/applications/dev.kollegen.client.desktop
      - install -Dm644 dev.kollegen.client.metainfo.xml /app/share/metainfo/dev.kollegen.client.metainfo.xml
