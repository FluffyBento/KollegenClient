plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Vendored local Maven repo: the `dev.kollegen:discord-rpc` artifact is
    // only ever published to the now-defunct JCenter, so we commit it under
    // `libs/` and resolve it from here on every machine / CI runner.
    maven { url = uri("${projectDir}/libs") }
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Discord Rich Presence (Minnced) – vendored locally (club.minnced sources
    // from java-discord-rpc v1.3.6 + JNA + native libs) since the original
    // artifact was only ever published to the now-defunct JCenter.
    implementation('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
    include('dev.kollegen:discord-rpc:1.3.6') { transitive = false }

    // Fabric Loom automatically registers the Mixin annotation processor and
    // generates the refmap (kollegen-client-mod.refmap.json). It must be declared
    // in kollegen.mixins.json via the "refmap" key so Mixin can resolve Yarn
    // method names against the obfuscated runtime.
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "kollegen-client-mod.refmap.json"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(['version': project.version])
    }
}

// VulkanMod (LGPL-3.0) wird als Resource in unser Mod-Jar eingebettet, damit der
// Kollegen-Client den Vulkan-Renderer selbstständig mitbringt – kein externer
// VulkanMod-Download mehr nötig. Wird nur heruntergeladen, wenn lokal nicht
// vorhanden (frischer Clone / CI). Die Datei ist in .gitignore (20 MB).
def vulkanRes = file("src/main/resources/dev/kollegen/client/vulkanmod.bin")
def vulkanUrl = "https://cdn.modrinth.com/data/JYQhtZtO/versions/hWKRTXbQ/VulkanMod-0.6.8%2B1.21.11.jar"
tasks.register('vendorVulkanMod') {
    onlyIf { !vulkanRes.exists() }
    doLast {
        vulkanRes.parentFile.mkdirs()
        ant.get(src: vulkanUrl, dest: vulkanRes, verbose: true)
    }
}
processResources.dependsOn vendorVulkanMod

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
