
buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.7.1'
        classpath 'net.fabricmc:fabric-loom:1.18.2'
    }
}

plugins {
    id 'maven-publish'
}

if (project.minecraft_version.startsWith('1.21')) {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
    apply plugin: 'net.fabricmc.fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    
    
    
    maven { url = uri("${projectDir}/libs") }
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}
loom {
    splitEnvironmentSourceSets()

    mods {
        "kollegen-client" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
    include('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
}

if (project.minecraft_version.startsWith('1.21')) {
    dependencies {
        mappings loom.officialMojangMappings()
        clientImplementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    }

    def portDir = file("${buildDir}/port1211-src")
    tasks.register('cleanVendoredBins1211') {
        doLast {
            fileTree('src/main/resources/dev/kollegen/client').matching { include '*.bin' }.each { File f ->
                if (!f.name.equals('vulkanmod.bin')) {
                    f.delete()
                }
            }
        }
    }
    tasks.matching { it.name.startsWith('vendor') }.configureEach {
        dependsOn('cleanVendoredBins1211')
    }
    tasks.register('portSources1211') {
        dependsOn('cleanVendoredBins1211')
        doLast {
            delete(portDir)
            copy {
                from('src/main/java')
                into("${portDir}/main/java")
            }
            copy {
                from('src/client/java')
                into("${portDir}/client/java")
            }
            fileTree("${portDir}").matching { include '**/*.java' }.each { File f ->
                String rel = portDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                String t = f.getText('UTF-8')
                t = t.replace('GuiGraphicsExtractor', 'GuiGraphics')
                    .replace('.text(', '.drawString(')
                    .replace('.item(', '.renderItem(')
                    .replace('.gui.screen()', '.screen')
                    .replace('renderer.state.level.CameraRenderState', 'renderer.state.CameraRenderState')
                    .replace('renderer.state.level.SkyRenderState', 'renderer.state.SkyRenderState')
                    .replace('net.minecraft.client.multiplayer.chat.GuiMessageTag', 'net.minecraft.client.GuiMessageTag')
                    .replace('client/multiplayer/chat/GuiMessageTag', 'client/GuiMessageTag')
                    .replace('addPlayerMessage(', 'addMessage(')
                    .replace('.gui.hud.isHidden()', '.options.hideGui')
                    .replace('.gui.hud.getChat()', '.gui.getChat()')
                    .replace('0, title, !state.isDiscrete, state.lightCoords, camera);', '0, title, !state.isDiscrete, state.lightCoords, state.distanceToCameraSq, camera);')
                    .replace('0, level, !state.isDiscrete, state.lightCoords, camera);', '0, level, !state.isDiscrete, state.lightCoords, state.distanceToCameraSq, camera);')
                if (rel.endsWith('mixin/HudMixin.java')) {
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/client/DeltaTracker;)V', 'render(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/client/DeltaTracker;)V')
                    t = t.replace('@Mixin(Hud.class)', '@Mixin(Gui.class)')
                    t = t.replace('import net.minecraft.client.gui.Hud;', 'import net.minecraft.client.gui.Gui;')
                }
                if (rel.endsWith('mixin/ContainerScreenMixin.java')) {
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;IIF)V', 'renderBackground(Lnet/minecraft/client/gui/GuiGraphics;IIF)V')
                }
                if (rel.contains('/menu/')) {
                    if (rel.endsWith('menu/ThemeSelectorScreen.java')) {
                        t = t.replace('backBtn.extractRenderState(', 'backBtn.renderContents(')
                    }
                    t = t.replace('extractRenderState(', 'renderBackground(')
                }
                if (rel.endsWith('ui/GlassSlider.java') || rel.endsWith('ui/GlassToggle.java')) {
                    t = t.replace('extractWidgetRenderState(', 'renderWidget(')
                }
                if (rel.endsWith('ui/ColorButton.java') || rel.endsWith('ui/GlassButton.java')) {
                    t = t.replace('extractContents(', 'renderContents(')
                    t = t.replace('protected void renderContents(', 'public void renderContents(')
                }
                f.write(t, 'UTF-8')
            }
        }
    }
    sourceSets {
        main { java { srcDirs = ["${portDir}/main/java"] } }
        client {
            java {
                srcDirs = ["${portDir}/client/java"]
                exclude '**/FogRendererMixin.java'
                exclude '**/GameRendererMixin.java'
            }
        }
    }
    tasks.named('compileJava') { dependsOn('portSources1211') }
    tasks.named('compileClientJava') { dependsOn('portSources1211') }

    tasks.register('fixup1211Jar') {
        dependsOn('build')
        doLast {
            def jarFile = file("${buildDir}/libs/kollegen-client-mod-1.21.11-${project.mod_version}.jar")
            def infos = []
            def data = [:]
            new java.util.zip.ZipFile(jarFile).withCloseable { z ->
                z.entries().each { e ->
                    infos << e.name
                    data[e.name] = z.getInputStream(e).bytes
                }
            }
            def slurper = new groovy.json.JsonSlurper()
            def mix = slurper.parseText(new String(data['kollegen.mixins.json'], 'UTF-8'))
            mix.mixins = mix.mixins.findAll { !(it in ['FogRendererMixin', 'GameRendererMixin']) }
            mix.remove('refmap')
            data['kollegen.mixins.json'] = (groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mix)) + '\n').getBytes('UTF-8')
            def fmj = slurper.parseText(new String(data['fabric.mod.json'], 'UTF-8'))
            fmj.depends = [fabricloader: '>=0.16.0', minecraft: '>=1.21', java: '>=21']
            data['fabric.mod.json'] = (groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fmj)) + '\n').getBytes('UTF-8')
            jarFile.delete()
            new java.util.zip.ZipOutputStream(new FileOutputStream(jarFile)).withCloseable { out ->
                infos.each { name ->
                    out.putNextEntry(new java.util.zip.ZipEntry(name))
                    out.write(data[name])
                    out.closeEntry()
                }
            }
        }
    }
}










def modrinthPrimaryFileUrl(String slug, String mc, String loader) {
    def slurp = { String body -> new groovy.json.JsonSlurper().parseText(body) }
    def fetch = { String u ->
        def conn = new URL(u).openConnection()
        
        conn.setRequestProperty("User-Agent", "KollegenClient/${project.version} (+https://github.com/FluffyBento/KollegenClient)")
        conn.setConnectTimeout(20000)
        conn.setReadTimeout(120000)
        def code = conn.responseCode
        if (code != 200) {
            throw new GradleException("Modrinth-Anfrage fehlgeschlagen (HTTP ${code}) für: ${u}")
        }
        return slurp(conn.inputStream.getText("UTF-8"))
    }

    
    
    def enc = { String v -> java.net.URLEncoder.encode(v, "UTF-8") }

    List versions = []
    try {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version?game_versions=${enc("[\"${mc}\"]")}&loaders=${enc("[\"${loader}\"]")}")
    } catch (Exception e) {
        println("vendor${slug.capitalize()}Mod: gefilterte Modrinth-Abfrage fehlgeschlagen (${e.message}) – nutze ungefilterte Abfrage.")
    }

    if (!versions) {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version")
    }
    if (!versions) {
        throw new GradleException("Keine Modrinth-Versionen für '${slug}' gefunden.")
    }

    def chosen = versions.find { it.game_versions?.contains(mc) && it.loaders?.contains(loader) }
            ?: versions.find { it.game_versions?.contains(mc) }
            ?: versions.first()
    def file = (chosen.files.find { it.primary } ?: chosen.files[0])
    return file.url
}

def vendorModResource(String resourceRel, String slug, String urlOverride = null) {
    def res = file("src/main/resources/${resourceRel}")
    
    def safeSlug = slug.replaceAll('[^a-zA-Z0-9]', '')
    tasks.register("vendor${safeSlug.capitalize()}Mod") {
        onlyIf { !res.exists() }
        doLast {
            res.parentFile.mkdirs()
            
            
            def url = urlOverride ?: modrinthPrimaryFileUrl(slug, project.minecraft_version, "fabric")
            
            def cacheDir = file("${buildDir}/vendor-patch/${slug}")
            cacheDir.mkdirs()
            def download = new File(cacheDir, "${safeSlug}-orig.jar")
            if (!download.exists()) {
                ant.get(src: url, dest: download, verbose: true)
            }

            
            
            def unzipDir = new File(cacheDir, "unzipped")
            unzipDir.deleteDir()
            unzipDir.mkdirs()
            ant.unzip(src: download, dest: unzipDir)
            def fmj = new File(unzipDir, "fabric.mod.json")
            if (fmj.exists()) {
                def json = new groovy.json.JsonSlurper().parseText(fmj.text)
                if (!(json.custom instanceof Map)) {
                    json.custom = [:]
                }
                json.custom.modmenu = [parent: "kollegen-client"]
                fmj.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
            }
            ant.zip(destfile: res, basedir: unzipDir)
        }
    }
}


















