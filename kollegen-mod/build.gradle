
buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.7.1'
        classpath 'net.fabricmc:fabric-loom:1.18.2'
    }
}

plugins {
    id 'maven-publish'
}

if (project.minecraft_version.startsWith('1.21')) {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
    apply plugin: 'net.fabricmc.fabric-loom'
}

version = project.mod_version
ext.minecraft_range = (project.minecraft_version.toString().startsWith('1.21')) ? '>=1.21' : ('>=' + project.minecraft_version)
ext.java_range = (project.minecraft_version.toString().startsWith('1.21')) ? '>=21' : '>=25'
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    
    
    
    maven { url = uri("${projectDir}/libs") }
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}
loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            client()
            ideConfigGenerated = true
            runDir = "run"
        }
    }

    mods {
        "kollegen-client" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
    include('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
}

def is121 = project.minecraft_version.startsWith('1.21')
def is262 = project.minecraft_version.startsWith('26.')

if (is121) {
    dependencies {
        mappings loom.officialMojangMappings()
        clientImplementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    }
}
if (is262) {
    dependencies {
        clientImplementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
    }
}

if (is121) {
    def portDir = file("${buildDir}/port1211-src")
    tasks.register('cleanVendoredBins1211') {
        doLast {
            fileTree('src/main/resources/dev/kollegen/client').matching { include '*.bin' }.each { File f ->
                if (!f.name.equals('vulkanmod.bin')) {
                    f.delete()
                }
            }
        }
    }
    tasks.matching { it.name.startsWith('vendor') }.configureEach {
        dependsOn('cleanVendoredBins1211')
    }
    tasks.register('portSources1211') {
        dependsOn('cleanVendoredBins1211')
        doLast {
            delete(portDir)
            copy {
                from('src/main/java')
                into("${portDir}/main/java")
            }
            copy {
                from('src/client/java')
                into("${portDir}/client/java")
            }
            fileTree("${portDir}").matching { include '**/*.java' }.each { File f ->
                String rel = portDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                String t = f.getText('UTF-8')
                t = t.replace('GuiGraphicsExtractor', 'GuiGraphics')
                // Neue UI zeichnet Text über den Glass-Helper (Glass.text/...), nicht über
                // GuiGraphics.text — der Helper heißt in beiden Versionen gleich und darf
                // daher nicht zu drawString portiert werden (nur g.text( schon).
                t = t.replace('Glass.text(', 'Glass.__text__(')
                    .replace('.text(', '.drawString(')
                    .replace('Glass.__text__(', 'Glass.text(')
                    .replace('.item(', '.renderItem(')
                    .replace('.gui.screen()', '.screen')
                    .replace('renderer.state.level.CameraRenderState', 'renderer.state.CameraRenderState')
                    .replace('renderer.state.level.SkyRenderState', 'renderer.state.SkyRenderState')
                    .replace('renderer/state/level/CameraRenderState', 'renderer/state/CameraRenderState')
                    .replace('renderer/state/level/SkyRenderState', 'renderer/state/SkyRenderState')
                    .replace('net.minecraft.client.multiplayer.chat.GuiMessageTag', 'net.minecraft.client.GuiMessageTag')
                    .replace('client/multiplayer/chat/GuiMessageTag', 'client/GuiMessageTag')
                    .replace('addPlayerMessage(', 'addMessage(')
                    .replace('.gui.hud.isHidden()', '.options.hideGui')
                    .replace('.gui.hud.getChat()', '.gui.getChat()')
                    .replace('0, title, !state.isDiscrete, state.lightCoords, camera);', '0, title, !state.isDiscrete, state.lightCoords, state.distanceToCameraSq, camera);')
                    .replace('0, level, !state.isDiscrete, state.lightCoords, camera);', '0, level, !state.isDiscrete, state.lightCoords, state.distanceToCameraSq, camera);')
                if (rel.endsWith('mixin/HudMixin.java')) {
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/client/DeltaTracker;)V', 'render(Lnet/minecraft/client/gui/GuiGraphics;Lnet/minecraft/client/DeltaTracker;)V')
                    t = t.replace('@Mixin(Hud.class)', '@Mixin(Gui.class)')
                    t = t.replace('import net.minecraft.client.gui.Hud;', 'import net.minecraft.client.gui.Gui;')
                }
                if (rel.endsWith('mixin/ContainerScreenMixin.java')) {
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;IIF)V', 'renderBackground(Lnet/minecraft/client/gui/GuiGraphics;IIF)V')
                }
if (rel.endsWith('mixin/NametagMixin.java')) {
                    t = t.replace('method = "submitNameDisplay(', 'method = "submitNameTag(')
                }
                if (rel.endsWith('presence/PetRenderer.java')) {
                    t = t.replace('collector.submitNameTag(poseStack, new Vec3(pos.x, pos.y + 2.2, pos.z), 0, nameComp, true, 15728880, camera);', 'collector.submitNameTag(poseStack, new Vec3(pos.x, pos.y + 2.2, pos.z), 0, nameComp, true, 15728880, 0.0, camera);')
                    if (!t.contains('EntitySpawnReason')) {
                        t = t.replace('type.create(level)', 'type.create(level, net.minecraft.world.entity.EntitySpawnReason.LOAD)')
                    }
                }
                if (rel.endsWith('presence/MythicPets.java')) {
                    t = t.replace('collector.submitNameTag(poseStack, anchor, 0, comp, false, 15728880, state.cameraRenderState);', 'collector.submitNameTag(poseStack, anchor, 0, comp, false, 15728880, 0.0, state.cameraRenderState);')
                }
                if (rel.endsWith('presence/BlubPets.java')) {
                    t = t.replace('collector.submitNameTag(poseStack, anchor, 0, comp, false, 15728880, state.cameraRenderState);', 'collector.submitNameTag(poseStack, anchor, 0, comp, false, 15728880, 0.0, state.cameraRenderState);')
                }
                if (rel.endsWith('mixin/NametagMixin.java')) {
                    t = t.replace('method = "submitNameDisplay(', 'method = "submitNameTag(')
                    t = t.replace('renderer/state/level/CameraRenderState;)V', 'renderer/state/CameraRenderState;)V')
                    if (!t.contains('import dev.kollegen.client.presence.PetRenderer;')) {
                        t = t.replace('import dev.kollegen.client.presence.KollegenPresence;', 'import dev.kollegen.client.presence.KollegenPresence;\nimport dev.kollegen.client.presence.PetRenderer;')
                    }
                }
                if (rel.endsWith('mixin/GameRendererMixin.java')) {
                    t = t.replace('@Mixin(Camera.class)', '@Mixin(GameRenderer.class)')
                    t = t.replace('import net.minecraft.client.Camera;', 'import net.minecraft.client.Camera;\nimport net.minecraft.client.renderer.GameRenderer;')
                    t = t.replace('method = "getFov"', 'method = "getFov(Lnet/minecraft/client/Camera;FZ)F"')
                    t = t.replace('private void kollegen$zoomFov(CallbackInfoReturnable<Float> cir) {', 'private void kollegen$zoomFov(Camera camera, float partialTick, boolean allowZoom, CallbackInfoReturnable<Float> cir) {')
                }
                if (rel.endsWith('presence/KollegenPresence.java')) {
                    t = t.replace('import net.minecraft.client.renderer.entity.state.EntityRenderState;', 'import net.minecraft.client.renderer.entity.state.EntityRenderState;\nimport net.minecraft.world.level.Level;')
                    t = t.replace('Level level = mc != null ? mc.level : null;', 'net.minecraft.world.level.Level level = mc != null ? mc.level : null;')
                }
if (rel.endsWith('mixin/MinecraftAccessor.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.CameraRenderState;', 'import net.minecraft.client.renderer.state.CameraRenderState;')
                    t = t.replace('net.minecraft.client.renderer.GameRenderer', 'net.minecraft.client.renderer.GameRenderer')
                    t = t.replace('net.minecraft.client.renderer.SubmitNodeCollector', 'net.minecraft.client.renderer.SubmitNodeCollector')
                }
                if (rel.endsWith('mixin/PetLevelRendererMixin.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.CameraRenderState;', 'import net.minecraft.client.renderer.state.CameraRenderState;')
                    t = t.replace('dev.kollegen.client.mixin.MinecraftAccessor accessor = (dev.kollegen.client.mixin.MinecraftAccessor) mc;', 'dev.kollegen.client.mixin.MinecraftAccessor accessor = (dev.kollegen.client.mixin.MinecraftAccessor) mc;')
                    t = t.replace('net.minecraft.client.renderer.GameRenderer gameRenderer = accessor.kollegen$getGameRenderer();', 'net.minecraft.client.renderer.GameRenderer gameRenderer = accessor.kollegen$getGameRenderer();')
                }
                if (rel.endsWith('mixin/LevelRendererMixin.java')) {
                    t = t.replace('renderLevel(Lcom/mojang/blaze3d/vertex/PoseStack;Lnet/minecraft/client/renderer/SubmitNodeCollector;Lnet/minecraft/client/renderer/state/level/CameraRenderState;FZ)V', 'renderLevel(Lcom/mojang/blaze3d/vertex/PoseStack;Lnet/minecraft/client/renderer/SubmitNodeCollector;Lnet/minecraft/client/renderer/state/CameraRenderState;FZ)V')
                    t = t.replace('renderer.state.level.CameraRenderState', 'renderer.state.CameraRenderState')
                }
                if (rel.endsWith('mixin/LogoRendererMixin.java')) {
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;IF)V', 'renderLogo(Lnet/minecraft/client/gui/GuiGraphics;IF)V')
                    t = t.replace('extractRenderState(Lnet/minecraft/client/gui/GuiGraphics;IFI)V', 'renderLogo(Lnet/minecraft/client/gui/GuiGraphics;IFI)V')
                }
                if (rel.contains('/menu/')) {
                    if (rel.endsWith('menu/ThemeSelectorScreen.java')) {
                        t = t.replace('backBtn.extractRenderState(', 'backBtn.renderContents(')
                    }
                    t = t.replace('extractRenderState(', 'renderBackground(')
                }
                if (rel.contains('/game/')) {
                    // Spiel-Screens: gleicheumbenennung wie /menu/ (Screen-API)
                    t = t.replace('extractRenderState(', 'renderBackground(')
                }
                if (rel.endsWith('ui/GlassSlider.java') || rel.endsWith('ui/GlassToggle.java')) {
                    t = t.replace('extractWidgetRenderState(', 'renderWidget(')
                }
                if (rel.endsWith('ui/ColorButton.java') || rel.endsWith('ui/GlassButton.java')) {
                    t = t.replace('extractContents(', 'renderContents(')
                    t = t.replace('protected void renderContents(', 'public void renderContents(')
                }
                f.write(t, 'UTF-8')
            }
        }
    }
    sourceSets {
        main { java { srcDirs = ["${portDir}/main/java"] } }
        client {
            java {
                    srcDirs = ["${portDir}/client/java"]
                    exclude '**/FogRendererMixin.java'
                    exclude '**/BlockEntityRenderDispatcherMixin.java'
                    exclude '**/MthMixin.java'
                    exclude '**/BlockTintCacheMixin.java'
                    exclude '**/EntityRendererMixin.java'
                    exclude '**/ItemClusterRenderStateMixin.java'
                    exclude '**/WeatherEffectRendererMixin.java'
                    exclude '**/FramerateLimitTrackerMixin.java'
                    exclude '**/SoundEngineMixin.java'
                    exclude '**/ClientChunkCacheMixin.java'
                    exclude '**/ClientLevelMixin.java'
                }
            }
        }
        tasks.named('compileJava') { dependsOn('portSources1211') }
    tasks.named('compileClientJava') { dependsOn('portSources1211') }

    tasks.register('fixup1211Jar') {
        dependsOn('build')
        doLast {
            def jarFile = file("${buildDir}/libs/${project.archives_base_name}-${project.mod_version}.jar")
            def targetFile = file("${buildDir}/libs/kollegen-client-mod-1.21.11.jar")
            def infos = []
            def data = [:]
            new java.util.zip.ZipFile(jarFile).withCloseable { z ->
                z.entries().each { e ->
                    infos << e.name
                    data[e.name] = z.getInputStream(e).bytes
                }
            }
            def slurper = new groovy.json.JsonSlurper()
            def mix = slurper.parseText(new String(data['kollegen.mixins.json'], 'UTF-8'))
            mix.remove('refmap')
            mix.mixins = mix.mixins.findAll { !(it in ['FogRendererMixin', 'BlockEntityRenderDispatcherMixin', 'MthMixin', 'BlockTintCacheMixin', 'EntityRendererMixin', 'ItemClusterRenderStateMixin', 'WeatherEffectRendererMixin', 'FramerateLimitTrackerMixin', 'SoundEngineMixin', 'ClientChunkCacheMixin', 'ClientLevelMixin']) }
            data['kollegen.mixins.json'] = (groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mix)) + '\n').getBytes('UTF-8')
            def fmj = slurper.parseText(new String(data['fabric.mod.json'], 'UTF-8'))
            fmj.depends = [fabricloader: '>=0.16.0', minecraft: '>=1.21', java: '>=21']
            data['fabric.mod.json'] = (groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fmj)) + '\n').getBytes('UTF-8')
            targetFile.delete()
            new java.util.zip.ZipOutputStream(new FileOutputStream(targetFile)).withCloseable { out ->
                infos.each { name ->
                    out.putNextEntry(new java.util.zip.ZipEntry(name))
                    out.write(data[name])
                    out.closeEntry()
                }
            }
        }
    }
}

if (is262) {
    def portDir = file("${buildDir}/port262-src")
    tasks.register('cleanVendoredBins262') {
        doLast {
            fileTree('src/main/resources/dev/kollegen/client').matching { include '*.bin' }.each { File f ->
                f.delete()
            }
        }
    }
    tasks.register('portSources262') {
        dependsOn('cleanVendoredBins262')
        doLast {
            delete(portDir)
            copy {
                from('src/main/java')
                into("${portDir}/main/java")
            }
            copy {
                from('src/client/java')
                into("${portDir}/client/java")
            }
            if (project.minecraft_version.startsWith('26.3')) {
                copy {
                    from('src/compat263/java')
                    into("${portDir}/client/java")
                }
            }
            fileTree("${portDir}").matching { include '**/*.java' }.each { File f ->
                String rel = portDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                String t = f.getText('UTF-8')
                if (rel.endsWith('presence/MythicPets.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.LevelRenderState;', 'import net.minecraft.client.renderer.state.level.LevelRenderState;')
                }
                if (rel.endsWith('presence/BlubPets.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.LevelRenderState;', 'import net.minecraft.client.renderer.state.level.LevelRenderState;')
                }
                if (rel.endsWith('presence/PetRenderer.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.LevelRenderState;', 'import net.minecraft.client.renderer.state.level.LevelRenderState;')
                    t = t.replace('return EntityType.ENDER_DRAGON;', 'return EntityTypes.ENDER_DRAGON;')
                    t = t.replace('if (petKind == null) return EntityType.ALLAY;', 'if (petKind == null) return EntityTypes.ALLAY;')
                    t = t.replace('case "ender_dragon", "dragon", "enderdragon" -> EntityType.ENDER_DRAGON;', 'case "ender_dragon", "dragon", "enderdragon" -> EntityTypes.ENDER_DRAGON;')
                    t = t.replace('case "ender_dragon", "dragon", "enderdragon" -> EntityType.ALLAY;', 'case "ender_dragon", "dragon", "enderdragon" -> EntityTypes.ALLAY;')
                    t = t.replace('case "blub" -> EntityType.ITEM_DISPLAY;', 'case "blub" -> EntityTypes.ITEM_DISPLAY;')
                    t = t.replace('case "allay", "ender_dragon", "dragon", "enderdragon" -> EntityType.ALLAY;', 'case "allay", "ender_dragon", "dragon", "enderdragon" -> EntityTypes.ALLAY;')
                    t = t.replace('case "chicken", "hen" -> EntityType.CHICKEN;', 'case "chicken", "hen" -> EntityTypes.CHICKEN;')
                    t = t.replace('case "bee" -> EntityType.BEE;', 'case "bee" -> EntityTypes.BEE;')
                    t = t.replace('case "axolotl" -> EntityType.AXOLOTL;', 'case "axolotl" -> EntityTypes.AXOLOTL;')
                    t = t.replace('case "bat" -> EntityType.BAT;', 'case "bat" -> EntityTypes.BAT;')
                    t = t.replace('case "squid" -> EntityType.SQUID;', 'case "squid" -> EntityTypes.SQUID;')
                    t = t.replace('case "glow_squid", "glowsquid" -> EntityType.GLOW_SQUID;', 'case "glow_squid", "glowsquid" -> EntityTypes.GLOW_SQUID;')
                    t = t.replace('case "nautilus" -> EntityType.NAUTILUS;', 'case "nautilus" -> EntityTypes.NAUTILUS;')
                    t = t.replace('case "zombie_nautilus", "zombienautilus" -> EntityType.ZOMBIE_NAUTILUS;', 'case "zombie_nautilus", "zombienautilus" -> EntityTypes.ZOMBIE_NAUTILUS;')
                    t = t.replace('case "copper_golem", "coppergolem", "golem" -> EntityType.COPPER_GOLEM;', 'case "copper_golem", "coppergolem", "golem" -> EntityTypes.COPPER_GOLEM;')
                    t = t.replace('case "wolf", "dog" -> EntityType.WOLF;', 'case "wolf", "dog" -> EntityTypes.WOLF;')
                    t = t.replace('case "cat", "ocelot" -> EntityType.CAT;', 'case "cat", "ocelot" -> EntityTypes.CAT;')
                    t = t.replace('case "parrot" -> EntityType.PARROT;', 'case "parrot" -> EntityTypes.PARROT;')
                    t = t.replace('case "fox" -> EntityType.FOX;', 'case "fox" -> EntityTypes.FOX;')
                    t = t.replace('case "rabbit", "bunny" -> EntityType.RABBIT;', 'case "rabbit", "bunny" -> EntityTypes.RABBIT;')
                    t = t.replace('case "shulker" -> EntityType.SHULKER;', 'case "shulker" -> EntityTypes.SHULKER;')
                    t = t.replace('default -> EntityType.ENDER_DRAGON;', 'default -> EntityTypes.ENDER_DRAGON;')
                    t = t.replace('default -> EntityType.ALLAY;', 'default -> EntityTypes.ALLAY;')
                    if (!t.contains('import net.minecraft.world.entity.EntityTypes;')) {
                        t = t.replace('import net.minecraft.world.entity.EntityType;', 'import net.minecraft.world.entity.EntityType;\nimport net.minecraft.world.entity.EntityTypes;')
                    }
                }
                if (rel.endsWith('mixin/NametagMixin.java')) {
                    if (!t.contains('import dev.kollegen.client.presence.PetRenderer;')) {
                        t = t.replace('import dev.kollegen.client.presence.KollegenPresence;', 'import dev.kollegen.client.presence.KollegenPresence;\nimport dev.kollegen.client.presence.PetRenderer;')
                    }
                }
                if (rel.endsWith('mixin/PetLevelRendererMixin.java')) {
                    t = t.replace('import net.minecraft.client.renderer.state.LevelRenderState;', 'import net.minecraft.client.renderer.state.level.LevelRenderState;')
                    t = t.replace('    @Inject(method = "extractVisibleEntities(Lnet/minecraft/client/Camera;Lnet/minecraft/client/renderer/culling/Frustum;Lnet/minecraft/client/DeltaTracker;Lnet/minecraft/client/renderer/state/LevelRenderState;)V", at = @At("TAIL"))\n    private void kollegen$addPets(Camera camera, Frustum frustum, DeltaTracker tracker, LevelRenderState state, CallbackInfo ci) {\n        try {\n            Minecraft mc = Minecraft.getInstance();\n            if (mc == null || mc.level == null) return;\n            PetRenderer.extractPets(mc, tracker, state);\n        } catch (Throwable ignored) {\n        }\n    }\n\n', '')
                    t = t.replace('client/renderer/state/LevelRenderState;', 'client/renderer/state/level/LevelRenderState;')
                }
                if (rel.endsWith('mixin/PetLevelExtractorMixin.java')) {
                    t = 'package dev.kollegen.client.mixin;\n\nimport dev.kollegen.client.presence.PetRenderer;\nimport net.minecraft.client.Camera;\nimport net.minecraft.client.DeltaTracker;\nimport net.minecraft.client.Minecraft;\nimport net.minecraft.client.renderer.culling.Frustum;\nimport net.minecraft.client.renderer.extract.LevelExtractor;\nimport net.minecraft.client.renderer.state.level.LevelRenderState;\nimport org.spongepowered.asm.mixin.Mixin;\nimport org.spongepowered.asm.mixin.injection.At;\nimport org.spongepowered.asm.mixin.injection.Inject;\nimport org.spongepowered.asm.mixin.injection.callback.CallbackInfo;\n\n@Mixin(LevelExtractor.class)\npublic class PetLevelExtractorMixin {\n\n    @Inject(method = "extractVisibleEntities(Lnet/minecraft/client/Camera;Lnet/minecraft/client/renderer/culling/Frustum;Lnet/minecraft/client/DeltaTracker;Lnet/minecraft/client/renderer/state/level/LevelRenderState;)V", at = @At("TAIL"))\n    private void kollegen$addPets(Camera camera, Frustum frustum, DeltaTracker tracker, LevelRenderState state, CallbackInfo ci) {\n        try {\n            Minecraft mc = Minecraft.getInstance();\n            if (mc == null || mc.level == null) return;\n            PetRenderer.extractPets(mc, tracker, state, frustum);\n        } catch (Throwable ignored) {\n        }\n    }\n}\n'
                }
                if (project.minecraft_version.startsWith('26.2')) {
                    t = t.replace('com.mojang.renderpearl.api.buffers.GpuBuffer', 'com.mojang.blaze3d.buffers.GpuBuffer')
                         .replace('com.mojang.renderpearl.api.buffers.GpuBufferSlice', 'com.mojang.blaze3d.buffers.GpuBufferSlice')
                         .replace('com.mojang.renderpearl.api.commands.CommandEncoder', 'com.mojang.blaze3d.systems.CommandEncoder')
                         .replace('com.mojang.renderpearl.api.pipeline.RenderPipeline', 'com.mojang.blaze3d.pipeline.RenderPipeline')
                         .replace('com.mojang.renderpearl.api.textures.GpuTextureView', 'com.mojang.blaze3d.textures.GpuTextureView')
                         .replace('poseStack.rotate(', 'poseStack.mulPose(')
                         .replace('poseStack.rotateDegrees(com.mojang.math.Axis.XP, rx);', 'poseStack.mulPose(com.mojang.math.Axis.XP.rotationDegrees(rx));')
                         .replace('poseStack.rotateDegrees(com.mojang.math.Axis.YP, ry);', 'poseStack.mulPose(com.mojang.math.Axis.YP.rotationDegrees(ry));')
                         .replace('poseStack.rotateDegrees(com.mojang.math.Axis.ZP, rz);', 'poseStack.mulPose(com.mojang.math.Axis.ZP.rotationDegrees(rz));')
                         .replace('state.isFirstPerson = false;', '')
                         .replace('state.smartCull = false;', '')
                    if (rel.endsWith('presence/CosmeticRenderLayer.java')) {
                        t = t.replace('private static final net.minecraft.client.renderer.texture.UvMapping IDENTITY_UV = new net.minecraft.client.renderer.texture.UvMapping() {', 'private static final net.minecraft.client.renderer.texture.SpriteContents.UvTransform IDENTITY_UV = new net.minecraft.client.renderer.texture.SpriteContents.UvTransform();')
                        t = t.replace('@Override public float getU(float u) { return u; }', '')
                        t = t.replace('@Override public float getV(float v) { return v; }', '')
                        t = t.replace('};', '')
                    }
                    if (rel.endsWith('mixin/EquipmentLayerRendererMixin.java')) {
                        t = t.replace('return RenderTypes.armorCutoutNoCullGlint(id);', 'return RenderTypes.armorCutoutNoCull(id);')
                        t = t.replace('return RenderTypes.armorTrim(id, decal);', 'return RenderTypes.armorCutoutNoCull(id);')
                    }
                    if (rel.endsWith('mixin/CapeLayerMixin.java')) {
                        t = t.replace('collector.submitModel(this.model, state, poseStack,', 'collector.submitModel(this.model, state, poseStack,')
                    }
                    if (rel.endsWith('mixin/PostShaderMixin.java')) {
                        t = t.replace('this.gameRenderState.requestedPostEffects', 'this.gameRenderState.postShaderEnabled')
                        t = t.replace('chain.id()', 'chain.getName()')
                    }
                    if (rel.endsWith('mixin/SkyRendererMixin.java')) {
                        t = t.replace('state.sunriseAndSunsetColor = null;', 'state.sunriseAndSunsetColor = 0;')
                    }
                }
                if (project.minecraft_version.startsWith('26.3')) {
                    t = t.replace('import org.lwjgl.glfw.GLFW;', 'import dev.kollegen.client.input.sdl.GLFW;')
                         .replace('import org.lwjgl.glfw.GLFWGamepadState;', 'import dev.kollegen.client.input.sdl.GLFW.GLFWGamepadState;')
                         .replace('poseStack.mulPose(', 'poseStack.rotate(')
                    if (rel.endsWith('presence/PetRenderer.java')) {
                        t = t.replace('.setInvulnerable(', '.setPermanentlyInvulnerable(')
                    }
                    if (rel.endsWith('mixin/SkyRendererMixin.java')) {
                        t = t.replace('case 4 -> 0xFF_CCCC_CC;', 'case 4 -> new org.joml.Vector3f(0.8f, 0.8f, 0.8f);')
                             .replace('case 5 -> 0xFF_2E_13_48;', 'case 5 -> new org.joml.Vector3f(0.18f, 0.07f, 0.28f);')
                             .replace('case 6 -> 0xFF_4A_1E_10;', 'case 6 -> new org.joml.Vector3f(0.29f, 0.12f, 0.06f);')
                    }
                    if (rel.endsWith('mixin/MouseHandlerMixin.java')) {
                        t = t.replace('kollegen_client$cursor(long window, double x, double y, CallbackInfo ci)',
                                      'kollegen_client$cursor(long window, double x, double y, double xdelta, double ydelta, CallbackInfo ci)')
                    }
                    if (rel.endsWith('mixin/SkyBodiesMixin.java')) {
                        t = t.replace('renderSunMoonAndStars(Lcom/mojang/blaze3d/vertex/PoseStack;FFFLnet/minecraft/world/level/MoonPhase;FF)V',
                                      'renderSunMoonAndStars(Lcom/mojang/renderpearl/api/commands/RenderPass;Lcom/mojang/blaze3d/vertex/PoseStack;FFFLnet/minecraft/world/level/MoonPhase;FF)V')
                             .replace('(PoseStack matrices,',
                                      '(com.mojang.renderpearl.api.commands.RenderPass pass, PoseStack matrices,')
                    }
                }
                f.write(t, 'UTF-8')
            }
        }
    }
    sourceSets {
        main { java { srcDirs = ["${portDir}/main/java"] } }
        client {
            java {
                    srcDirs = ["${portDir}/client/java"]
                    exclude '**/DynamicGpuDataStorageMappedMixin.java'
                    exclude '**/DynamicGpuDataStorageNonMappedMixin.java'
                    exclude '**/FirstPersonHandsAndItemsRendererMixin.java'
                    exclude '**/PostShaderMixin.java'
                    exclude '**/CapeLayerMixin.java'
                    exclude '**/presence/CosmeticRenderLayer.java'
                    exclude '**/mixin/PlayerCosmeticsMixin.java'
                }
            }
        }
        tasks.named('compileJava') { dependsOn('portSources262') }
    tasks.named('compileClientJava') { dependsOn('portSources262') }
}










def modrinthPrimaryFileUrl(String slug, String mc, String loader) {
    def slurp = { String body -> new groovy.json.JsonSlurper().parseText(body) }
    def fetch = { String u ->
        def conn = new URL(u).openConnection()
        
        conn.setRequestProperty("User-Agent", "KollegenClient/${project.version} (+https://github.com/FluffyBento/KollegenClient)")
        conn.setConnectTimeout(20000)
        conn.setReadTimeout(120000)
        def code = conn.responseCode
        if (code != 200) {
            throw new GradleException("Modrinth-Anfrage fehlgeschlagen (HTTP ${code}) für: ${u}")
        }
        return slurp(conn.inputStream.getText("UTF-8"))
    }

    
    
    def enc = { String v -> java.net.URLEncoder.encode(v, "UTF-8") }

    List versions = []
    try {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version?game_versions=${enc("[\"${mc}\"]")}&loaders=${enc("[\"${loader}\"]")}")
    } catch (Exception e) {
        println("vendor${slug.capitalize()}Mod: gefilterte Modrinth-Abfrage fehlgeschlagen (${e.message}) – nutze ungefilterte Abfrage.")
    }

    if (!versions) {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version")
    }
    if (!versions) {
        throw new GradleException("Keine Modrinth-Versionen für '${slug}' gefunden.")
    }

    def chosen = versions.find { it.game_versions?.contains(mc) && it.loaders?.contains(loader) }
            ?: versions.find { it.game_versions?.contains(mc) }
            ?: versions.first()
    def file = (chosen.files.find { it.primary } ?: chosen.files[0])
    return file.url
}

def vendorModResource(String resourceRel, String slug, String urlOverride = null) {
    def res = file("src/main/resources/${resourceRel}")
    
    def safeSlug = slug.replaceAll('[^a-zA-Z0-9]', '')
    tasks.register("vendor${safeSlug.capitalize()}Mod") {
        onlyIf { !res.exists() }
        doLast {
            res.parentFile.mkdirs()
            
            
            def url = urlOverride ?: modrinthPrimaryFileUrl(slug, project.minecraft_version, "fabric")
            
            def cacheDir = file("${buildDir}/vendor-patch/${slug}")
            cacheDir.mkdirs()
            def download = new File(cacheDir, "${safeSlug}-${project.minecraft_version}-orig.jar")
            if (!download.exists()) {
                ant.get(src: url, dest: download, verbose: true)
            }

            
            
            def unzipDir = new File(cacheDir, "unzipped")
            unzipDir.deleteDir()
            unzipDir.mkdirs()
            ant.unzip(src: download, dest: unzipDir)
            def fmj = new File(unzipDir, "fabric.mod.json")
            if (fmj.exists()) {
                def json = new groovy.json.JsonSlurper().parseText(fmj.text)
                if (!(json.custom instanceof Map)) {
                    json.custom = [:]
                }
                json.custom.modmenu = [parent: "kollegen-client"]
                fmj.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
            }
            ant.zip(destfile: res, basedir: unzipDir)
        }
    }
}


















