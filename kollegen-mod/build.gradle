loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "kollegen-client-mod.refmap.json"
    }
}






def xaeroWorldMapJar = layout.buildDirectory.file('xaero/xaeroworldmap.jar')
tasks.register('downloadXaeroWorldMapJar') {
    def out = xaeroWorldMapJar.get().asFile
    outputs.file(out)
    doLast {
        out.parentFile.mkdirs()
        if (!out.exists()) {
            def url = modrinthPrimaryFileUrl('xaeros-world-map', project.minecraft_version, 'fabric')
            def conn = new URL(url).openConnection()
            conn.setRequestProperty("User-Agent", "KollegenClient/${project.version}")
            out.bytes = conn.inputStream.bytes
        }
    }
}
compileJava.dependsOn downloadXaeroWorldMapJar
dependencies {
    compileOnly files(xaeroWorldMapJar)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(['version': project.version])
    }
}








def vulkanRes = file("src/main/resources/dev/kollegen/client/vulkanmod.bin")
def vulkanUrl = "https://cdn.modrinth.com/data/JYQhtZtO/versions/hWKRTXbQ/VulkanMod-0.6.8%2B1.21.11.jar"
tasks.register('vendorVulkanMod') {
    doLast {
        vulkanRes.parentFile.mkdirs()
        def cacheDir = file("${buildDir}/vulkanmod-patch")
        cacheDir.mkdirs()
        
        def download = file("${cacheDir}/VulkanMod-orig.jar")
        if (!download.exists()) {
            ant.get(src: vulkanUrl, dest: download, verbose: true)
        }

        def unzipDir = file("${cacheDir}/unzipped")
        unzipDir.deleteDir()
        unzipDir.mkdirs()
        ant.unzip(src: download, dest: unzipDir)

        
        def srcLogo = file("src/main/resources/assets/kollegen/textures/kollegen.png")
        if (srcLogo.exists()) {
            ant.copy(file: srcLogo, tofile: file("${unzipDir}/assets/vulkanmod/vlogo.png"))
            ant.copy(file: srcLogo, tofile: file("${unzipDir}/assets/vulkanmod/vlogo_transparent.png"))
        }

        
        def fabricFile = file("${unzipDir}/fabric.mod.json")
        if (fabricFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(fabricFile.text)
            json.name = "Kollegen Client Vulkan+${project.version}"
            json.description = "Vulkan-Renderer (VulkanMod), integriert in den Kollegen Client. Von Kollegen Client verwaltet."
            
            if (!(json.custom instanceof Map)) {
                json.custom = [:]
            }
            json.custom.modmenu = [parent: "kollegen-client"]
            fabricFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        
        def langFile = file("${unzipDir}/assets/vulkanmod/lang/en_us.json")
        if (langFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(langFile.text)
            
            json["vulkanmod.options.unknown"] = "Unbekannt"
            json["vulkanmod.options.pages.video"] = "Video"
            json["vulkanmod.options.pages.graphics"] = "Grafik"
            json["vulkanmod.options.pages.optimizations"] = "Optimierungen"
            json["vulkanmod.options.pages.other"] = "Sonstiges"
            json["vulkanmod.options.performanceImpact"] = "Performance-Auswirkung: %s"
            json["vulkanmod.options.performanceImpact.low"] = "Niedrig"
            json["vulkanmod.options.performanceImpact.medium"] = "Mittel"
            json["vulkanmod.options.performanceImpact.high"] = "Hoch"
            json["vulkanmod.options.buttons.apply"] = "Anwenden"
            json["vulkanmod.options.buttons.undo"] = "Zurücksetzen"
            json["vulkanmod.options.buttons.kofi"] = "Zum Discord"
            json["vulkanmod.options.buttons.update_available"] = "Update verfügbar!"
            json["vulkanmod.options.advCulling"] = "Erweitertes Chunk-Culling"
            json["vulkanmod.options.advCulling.aggressive"] = "Aggressiv"
            json["vulkanmod.options.advCulling.conservative"] = "Konservativ"
            json["vulkanmod.options.advCulling.normal"] = "Normal"
            json["vulkanmod.options.advCulling.tooltip"] = "Verwendet einen Culling-Algorithmus, der die Performance durch Reduzierung nicht sichtbarer Chunk-Abschnitte verbessern kann."
            json["vulkanmod.options.ao.subBlock"] = "Sub-Block"
            json["vulkanmod.options.ao.subBlock.tooltip"] = "Aktiviert weiche Beleuchtung für nicht-vollständige Blöcke (experimentell)."
            json["vulkanmod.options.deviceSelector"] = "Geräte-Auswahl"
            json["vulkanmod.options.deviceSelector.auto"] = "Auto"
            json["vulkanmod.options.deviceSelector.tooltip"] = "Aktuelles Gerät"
            json["vulkanmod.options.entityCulling"] = "Entity-Culling"
            json["vulkanmod.options.entityCulling.tooltip"] = "Aktiviert Culling für Entitäten in nicht sichtbaren Abschnitten."
            json["vulkanmod.options.frameQueue"] = "Render-Warteschlangengröße"
            json["vulkanmod.options.frameQueue.tooltip"] = "Höhere Werte können Frametimes stabilisieren, erhöhen aber die Eingabeverzögerung."
            json["vulkanmod.options.backfaceCulling"] = "Backface-Culling"
            json["vulkanmod.options.backfaceCulling.tooltip"] = "Blendet nicht sichtbare Blockseiten auf der CPU aus, verbessert GPU-Performance. Für weniger CPU-Overhead: Indirect Draw aktivieren."
            json["vulkanmod.options.indirectDraw"] = "Indirect Draw"
            json["vulkanmod.options.indirectDraw.tooltip"] = "Reduziert CPU-Overhead, kann GPU-Overhead erhöhen."
            json["vulkanmod.options.refreshRate"] = "Vollbild-Bildwiederholrate"
            json["vulkanmod.options.uniqueOpaqueLayer"] = "Eindeutiger undurchsichtiger Layer"
            json["vulkanmod.options.uniqueOpaqueLayer.tooltip"] = "Verwendet einen einzigartigen Render-Layer für undurchsichtiges Terrain zur Performance-Verbesserung."
            json["vulkanmod.options.wayland"] = "Wayland nutzen"
            json["vulkanmod.options.wayland.tooltip"] = "Nutzt Linux Wayland Compositor falls verfügbar (Experimentell). Erfordert Neustart."
            json["vulkanmod.options.windowMode"] = "Fenstermodus"
            json["vulkanmod.options.windowMode.windowed"] = "Fenster"
            json["vulkanmod.options.windowMode.windowedFullscreen"] = "Vollbild im Fenster"
            json["vulkanmod.options.builderThreads"] = "Chunk-Builder-Threads"
            json["vulkanmod.options.builderThreads.auto"] = "Auto"
            json["vulkanmod.options.textureAnimations"] = "Textur-Animationen"
            json["vulkanmod.options.searchFieldPlaceholder"] = "Grafikeinstellungen suchen"
            langFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        
        def mixinFile = file("${unzipDir}/vulkanmod.mixins.json")
        if (mixinFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(mixinFile.text)
            json.mixins.each { mixin ->
                if (mixin.config && mixin.config.injectors) {
                    mixin.config.injectors.each { injector ->
                        if (injector.method?.contains("method_60895") && injector.at?.value == "INVOKE") {
                            injector.priority = 1100
                        }
                    }
                }
            }
            mixinFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        
        def voptionScreen = file("${unzipDir}/net/vulkanmod/config/gui/VOptionScreen.class")
        if (voptionScreen.exists()) {
            def classBytes = voptionScreen.bytes
            def reader = new org.objectweb.asm.ClassReader(classBytes)
            def writer = new org.objectweb.asm.ClassWriter(reader, org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
            def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String signature, String[] exceptions) {
                    def mv = super.visitMethod(access, name, desc, signature, exceptions)
                    if (name == "<init>" || name == "<clinit>") {
                        return new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM9, mv) {
                            void visitLdcInsn(Object value) {
                                if (value instanceof String && value.contains("ko-fi.com/xcollateral")) {
                                    super.visitLdcInsn("https://dsc.gg/Kollegen")
                                    return
                                }
                                super.visitLdcInsn(value)
                            }
                        }
                    }
                    return mv
                }
            }
            reader.accept(visitor, 0)
            file("${unzipDir}/net/vulkanmod/config/gui/VOptionScreen.class").bytes = writer.toByteArray()
        }

        
        
        def colorUtil = file("${unzipDir}/net/vulkanmod/vulkan/util/ColorUtil\$ARGB.class")
        if (colorUtil.exists()) {
            def cuReader = new org.objectweb.asm.ClassReader(colorUtil.bytes)
            def cuWriter = new org.objectweb.asm.ClassWriter(cuReader, org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
            def cuVisitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, cuWriter) {
                void visitLdcInsn(Object value) {
                    if (value instanceof Integer) {
                        int v = value.intValue()
                        if (v == (0xffffff as int)) { super.visitLdcInsn(0xFFf3e9d8 as int); return }
                        if (v == (0xFF00FF00 as int)) { super.visitLdcInsn(0xFFf5a623 as int); return }
                        if (v == (0xff0000 as int)) { super.visitLdcInsn(0xFFff5b6e as int); return }
                    }
                    super.visitLdcInsn(value)
                }
            }
            cuReader.accept(cuVisitor, 0)
            colorUtil.bytes = cuWriter.toByteArray()
        }

        
        def patchedJar = file("${cacheDir}/VulkanMod-patched.jar")
        ant.zip(destfile: patchedJar, basedir: unzipDir)

        
        ant.copy(file: patchedJar, tofile: vulkanRes)
    }
}
processResources.dependsOn vendorVulkanMod, sodiumTask, irisTask, berylTask,
        spotifyTask, flkTask, fabricApiTask, owoTask, modMenuTask,
        tpaTask, silkTask, clothConfigTask, chatHeadsTask

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
