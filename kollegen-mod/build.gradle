// ASM for bytecode patching (VulkanMod patches)
buildscript {
    dependencies {
        classpath 'org.ow2.asm:asm:9.7.1'
    }
}

plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Vendored local Maven repo: the `dev.kollegen:discord-rpc` artifact is
    // only ever published to the now-defunct JCenter, so we commit it under
    // `libs/` and resolve it from here on every machine / CI runner.
    maven { url = uri("${projectDir}/libs") }
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Discord Rich Presence (Minnced) – vendored locally (club.minnced sources
    // from java-discord-rpc v1.3.6 + JNA + native libs) since the original
    // artifact was only ever published to the now-defunct JCenter.
    implementation('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
    include('dev.kollegen:discord-rpc:1.3.6') { transitive = false }

    // Fabric Loom automatically registers the Mixin annotation processor and
    // generates the refmap (kollegen-client-mod.refmap.json). It must be declared
    // in kollegen.mixins.json via the "refmap" key so Mixin can resolve Yarn
    // method names against the obfuscated runtime.
}

// ── Eingebettete Renderer-Mods ───────────────────────────────────────────────
// VulkanMod (LGPL) wird gepatcht (siehe vendorVulkanMod). Sodium, Iris und Beryl
// werden als Resource eingebettet und zur Laufzeit vom Kollegen-Client je nach
// Renderer-Gruppe deployed (.jar) bzw. deaktiviert (.disabled).
//
// Alle vier jars bekommen beim Vendoring ihre fabric.mod.json um
// "custom.modmenu.parent = kollegen-client" ergänzt – dadurch ordnet ModMenu sie
// als Unterpunkte des Kollegen-Client ein statt als eigene Top-Level-Mods.

def modrinthPrimaryFileUrl(String slug, String mc, String loader) {
    def slurp = { String body -> new groovy.json.JsonSlurper().parseText(body) }
    def fetch = { String u ->
        def conn = new URL(u).openConnection()
        // Modrinth verlangt einen User-Agent ohne diesen droht 403/Rate-Limit.
        conn.setRequestProperty("User-Agent", "KollegenClient/${project.version} (+https://github.com/FluffyBento/KollegenClient)")
        conn.setConnectTimeout(20000)
        conn.setReadTimeout(120000)
        def code = conn.responseCode
        if (code != 200) {
            throw new GradleException("Modrinth-Anfrage fehlgeschlagen (HTTP ${code}) für: ${u}")
        }
        return slurp(conn.inputStream.getText("UTF-8"))
    }

    // Wichtig: Query-Parameter URL-enkodieren. Rohe [ ] " im Query-String
    // liefern sonst HTTP 400 von der Modrinth-API (Grund für den CI-Fehler).
    def enc = { String v -> java.net.URLEncoder.encode(v, "UTF-8") }

    List versions = []
    try {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version?game_versions=${enc("[\"${mc}\"]")}&loaders=${enc("[\"${loader}\"]")}")
    } catch (Exception e) {
        println("vendor${slug.capitalize()}Mod: gefilterte Modrinth-Abfrage fehlgeschlagen (${e.message}) – nutze ungefilterte Abfrage.")
    }

    // Fallback: alle Versionen laden und selbst filtern (robust gegen
    // unbekannte Game-Version-Tags).
    if (!versions) {
        versions = fetch("https://api.modrinth.com/v2/project/${slug}/version")
    }
    if (!versions) {
        throw new GradleException("Keine Modrinth-Versionen für '${slug}' gefunden.")
    }

    def chosen = versions.find { it.game_versions?.contains(mc) && it.loaders?.contains(loader) }
            ?: versions.find { it.game_versions?.contains(mc) }
            ?: versions.first()
    def file = (chosen.files.find { it.primary } ?: chosen.files[0])
    return file.url
}

def vendorModResource(String resourceRel, String slug, String urlOverride = null) {
    def res = file("src/main/resources/${resourceRel}")
    // Task-Namen dürfen keine Bindestriche enthalten (z.B. "chat-heads").
    def safeSlug = slug.replaceAll('[^a-zA-Z0-9]', '')
    tasks.register("vendor${safeSlug.capitalize()}Mod") {
        onlyIf { !res.exists() }
        doLast {
            res.parentFile.mkdirs()
            // urlOverride: fest gepinnte Version (z.B. Spotify Overlay), sonst
            // die neueste Modrinth-Version passend zur MC-Version.
            def url = urlOverride ?: modrinthPrimaryFileUrl(slug, project.minecraft_version, "fabric")
            // Original-Jar cachen (Download), danach immer neu patchen
            def cacheDir = file("${buildDir}/vendor-patch/${slug}")
            cacheDir.mkdirs()
            def download = new File(cacheDir, "${safeSlug}-orig.jar")
            if (!download.exists()) {
                ant.get(src: url, dest: download, verbose: true)
            }

            // Entpacken → fabric.mod.json für ModMenu patchen (unter dem
            // Kollegen-Client einordnen) → neu zippen.
            def unzipDir = new File(cacheDir, "unzipped")
            unzipDir.deleteDir()
            unzipDir.mkdirs()
            ant.unzip(src: download, dest: unzipDir)
            def fmj = new File(unzipDir, "fabric.mod.json")
            if (fmj.exists()) {
                def json = new groovy.json.JsonSlurper().parseText(fmj.text)
                if (!(json.custom instanceof Map)) {
                    json.custom = [:]
                }
                json.custom.modmenu = [parent: "kollegen-client"]
                fmj.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
            }
            ant.zip(destfile: res, basedir: unzipDir)
        }
    }
}

// Renderer-Gruppe. vendorModResource gibt den TaskProvider zurück – wir
// sammeln ihn direkt ein, statt Task-Namen in der dependsOn-Zeile zu raten.
def sodiumTask = vendorModResource('dev/kollegen/client/sodium.bin', 'sodium')
def irisTask = vendorModResource('dev/kollegen/client/iris.bin', 'iris')
def berylTask = vendorModResource('dev/kollegen/client/beryl.bin', 'beryl')

// Integrations-Bundles: Spotify Overlay (+ alle harten Dependencies laut dessen
// fabric.mod.json) und Chat Heads. Spotify ist bewusst auf die vom Nutzer
// angegebene Version gepinnt; der Rest zieht automatisch die neueste zur
// MC-Version passende Version.
def spotifyUrl = 'https://cdn.modrinth.com/data/iRsArBuW/versions/BMGGYY7f/spotify_overlay-1.0.17-SNAPSHOT%2Bfabric.1.21.11.jar'
def spotifyTask = vendorModResource('dev/kollegen/client/spotify.bin', 'spotify-overlay', spotifyUrl)
def flkTask = vendorModResource('dev/kollegen/client/flk.bin', 'fabric-language-kotlin')
def fabricApiTask = vendorModResource('dev/kollegen/client/fabricapi.bin', 'fabric-api')
def owoTask = vendorModResource('dev/kollegen/client/owo.bin', 'owo-lib')
def modMenuTask = vendorModResource('dev/kollegen/client/modmenu.bin', 'modmenu')
def tpaTask = vendorModResource('dev/kollegen/client/tpa.bin', 'placeholder-api')
def silkTask = vendorModResource('dev/kollegen/client/silk.bin', 'silk')
def clothConfigTask = vendorModResource('dev/kollegen/client/clothconfig.bin', 'cloth-config')
def chatHeadsTask = vendorModResource('dev/kollegen/client/chatheads.bin', 'chat-heads')

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "kollegen-client-mod.refmap.json"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(['version': project.version])
    }
}

// VulkanMod (LGPL-3.0) wird gepatcht und als Resource eingebettet:
//  1. Logo durch Kollegen.png ersetzen
//  2. fabric.mod.json Name/Description für F3-Branding
//  3. Sprache auf Deutsch übersetzen + "Support me" → "Zum Discord" (dsc.gg/Kollegen)
//  4. Mixin-Priorität RenderTypeM 1000 → 1100 (npcstudio-Konflikt vermeiden)
//  5. "Support me"-Button (Ko-fi) → "Zum Discord" (dsc.gg/Kollegen)
//  6. Farbpalette (ColorUtil$ARGB): Weiß→Creme, Grün→Akzent, Rot→Danger – Kollegen-Look
def vulkanRes = file("src/main/resources/dev/kollegen/client/vulkanmod.bin")
def vulkanUrl = "https://cdn.modrinth.com/data/JYQhtZtO/versions/hWKRTXbQ/VulkanMod-0.6.8%2B1.21.11.jar"
tasks.register('vendorVulkanMod') {
    doLast {
        vulkanRes.parentFile.mkdirs()
        def cacheDir = file("${buildDir}/vulkanmod-patch")
        cacheDir.mkdirs()
        // Original-Jar nur einmal cachen (Download), danach immer neu patchen
        def download = file("${cacheDir}/VulkanMod-orig.jar")
        if (!download.exists()) {
            ant.get(src: vulkanUrl, dest: download, verbose: true)
        }

        def unzipDir = file("${cacheDir}/unzipped")
        unzipDir.deleteDir()
        unzipDir.mkdirs()
        ant.unzip(src: download, dest: unzipDir)

        // 1) Logo ersetzen: Kollegen.png → vlogo.png + vlogo_transparent.png
        def srcLogo = file("src/main/resources/assets/kollegen/textures/kollegen.png")
        if (srcLogo.exists()) {
            ant.copy(file: srcLogo, tofile: file("${unzipDir}/assets/vulkanmod/vlogo.png"))
            ant.copy(file: srcLogo, tofile: file("${unzipDir}/assets/vulkanmod/vlogo_transparent.png"))
        }

        // 2) fabric.mod.json patchen: Name + Description für F3
        def fabricFile = file("${unzipDir}/fabric.mod.json")
        if (fabricFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(fabricFile.text)
            json.name = "Kollegen Client Vulkan+${project.version}"
            json.description = "Vulkan-Renderer (VulkanMod), integriert in den Kollegen Client. Von Kollegen Client verwaltet."
            // In ModMenu unter dem Kollegen-Client einordnen statt Top-Level-Eintrag
            if (!(json.custom instanceof Map)) {
                json.custom = [:]
            }
            json.custom.modmenu = [parent: "kollegen-client"]
            fabricFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        // 3) Sprache auf Deutsch übersetzen + "Support me" → "Zum Discord"
        def langFile = file("${unzipDir}/assets/vulkanmod/lang/en_us.json")
        if (langFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(langFile.text)
            // Deutsch-Übersetzung
            json["vulkanmod.options.unknown"] = "Unbekannt"
            json["vulkanmod.options.pages.video"] = "Video"
            json["vulkanmod.options.pages.graphics"] = "Grafik"
            json["vulkanmod.options.pages.optimizations"] = "Optimierungen"
            json["vulkanmod.options.pages.other"] = "Sonstiges"
            json["vulkanmod.options.performanceImpact"] = "Performance-Auswirkung: %s"
            json["vulkanmod.options.performanceImpact.low"] = "Niedrig"
            json["vulkanmod.options.performanceImpact.medium"] = "Mittel"
            json["vulkanmod.options.performanceImpact.high"] = "Hoch"
            json["vulkanmod.options.buttons.apply"] = "Anwenden"
            json["vulkanmod.options.buttons.undo"] = "Zurücksetzen"
            json["vulkanmod.options.buttons.kofi"] = "Zum Discord"
            json["vulkanmod.options.buttons.update_available"] = "Update verfügbar!"
            json["vulkanmod.options.advCulling"] = "Erweitertes Chunk-Culling"
            json["vulkanmod.options.advCulling.aggressive"] = "Aggressiv"
            json["vulkanmod.options.advCulling.conservative"] = "Konservativ"
            json["vulkanmod.options.advCulling.normal"] = "Normal"
            json["vulkanmod.options.advCulling.tooltip"] = "Verwendet einen Culling-Algorithmus, der die Performance durch Reduzierung nicht sichtbarer Chunk-Abschnitte verbessern kann."
            json["vulkanmod.options.ao.subBlock"] = "Sub-Block"
            json["vulkanmod.options.ao.subBlock.tooltip"] = "Aktiviert weiche Beleuchtung für nicht-vollständige Blöcke (experimentell)."
            json["vulkanmod.options.deviceSelector"] = "Geräte-Auswahl"
            json["vulkanmod.options.deviceSelector.auto"] = "Auto"
            json["vulkanmod.options.deviceSelector.tooltip"] = "Aktuelles Gerät"
            json["vulkanmod.options.entityCulling"] = "Entity-Culling"
            json["vulkanmod.options.entityCulling.tooltip"] = "Aktiviert Culling für Entitäten in nicht sichtbaren Abschnitten."
            json["vulkanmod.options.frameQueue"] = "Render-Warteschlangengröße"
            json["vulkanmod.options.frameQueue.tooltip"] = "Höhere Werte können Frametimes stabilisieren, erhöhen aber die Eingabeverzögerung."
            json["vulkanmod.options.backfaceCulling"] = "Backface-Culling"
            json["vulkanmod.options.backfaceCulling.tooltip"] = "Blendet nicht sichtbare Blockseiten auf der CPU aus, verbessert GPU-Performance. Für weniger CPU-Overhead: Indirect Draw aktivieren."
            json["vulkanmod.options.indirectDraw"] = "Indirect Draw"
            json["vulkanmod.options.indirectDraw.tooltip"] = "Reduziert CPU-Overhead, kann GPU-Overhead erhöhen."
            json["vulkanmod.options.refreshRate"] = "Vollbild-Bildwiederholrate"
            json["vulkanmod.options.uniqueOpaqueLayer"] = "Eindeutiger undurchsichtiger Layer"
            json["vulkanmod.options.uniqueOpaqueLayer.tooltip"] = "Verwendet einen einzigartigen Render-Layer für undurchsichtiges Terrain zur Performance-Verbesserung."
            json["vulkanmod.options.wayland"] = "Wayland nutzen"
            json["vulkanmod.options.wayland.tooltip"] = "Nutzt Linux Wayland Compositor falls verfügbar (Experimentell). Erfordert Neustart."
            json["vulkanmod.options.windowMode"] = "Fenstermodus"
            json["vulkanmod.options.windowMode.windowed"] = "Fenster"
            json["vulkanmod.options.windowMode.windowedFullscreen"] = "Vollbild im Fenster"
            json["vulkanmod.options.builderThreads"] = "Chunk-Builder-Threads"
            json["vulkanmod.options.builderThreads.auto"] = "Auto"
            json["vulkanmod.options.textureAnimations"] = "Textur-Animationen"
            json["vulkanmod.options.searchFieldPlaceholder"] = "Grafikeinstellungen suchen"
            langFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        // 4) Mixin-Priorität patchen: RenderTypeM priority 1000 → 1100
        def mixinFile = file("${unzipDir}/vulkanmod.mixins.json")
        if (mixinFile.exists()) {
            def json = new groovy.json.JsonSlurper().parseText(mixinFile.text)
            json.mixins.each { mixin ->
                if (mixin.config && mixin.config.injectors) {
                    mixin.config.injectors.each { injector ->
                        if (injector.method?.contains("method_60895") && injector.at?.value == "INVOKE") {
                            injector.priority = 1100
                        }
                    }
                }
            }
            mixinFile.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)))
        }

        // 5) Bytecode patchen: Ko-fi URL → Discord URL in VOptionScreen.class
        def voptionScreen = file("${unzipDir}/net/vulkanmod/config/gui/VOptionScreen.class")
        if (voptionScreen.exists()) {
            def classBytes = voptionScreen.bytes
            def reader = new org.objectweb.asm.ClassReader(classBytes)
            def writer = new org.objectweb.asm.ClassWriter(reader, org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
            def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String signature, String[] exceptions) {
                    def mv = super.visitMethod(access, name, desc, signature, exceptions)
                    if (name == "<init>" || name == "<clinit>") {
                        return new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM9, mv) {
                            void visitLdcInsn(Object value) {
                                if (value instanceof String && value.contains("ko-fi.com/xcollateral")) {
                                    super.visitLdcInsn("https://dsc.gg/Kollegen")
                                    return
                                }
                                super.visitLdcInsn(value)
                            }
                        }
                    }
                    return mv
                }
            }
            reader.accept(visitor, 0)
            file("${unzipDir}/net/vulkanmod/config/gui/VOptionScreen.class").bytes = writer.toByteArray()
        }

        // 6) Farbpalette an Kollegen-Look anpassen (ColorUtil$ARGB):
        //    Weiß→Creme (Text), Grün→Kollegen-Akzent (orange), Rot→Kollegen-Danger
        def colorUtil = file("${unzipDir}/net/vulkanmod/vulkan/util/ColorUtil\$ARGB.class")
        if (colorUtil.exists()) {
            def cuReader = new org.objectweb.asm.ClassReader(colorUtil.bytes)
            def cuWriter = new org.objectweb.asm.ClassWriter(cuReader, org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
            def cuVisitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, cuWriter) {
                void visitLdcInsn(Object value) {
                    if (value instanceof Integer) {
                        int v = value.intValue()
                        if (v == (0xffffff as int)) { super.visitLdcInsn(0xFFf3e9d8 as int); return }
                        if (v == (0xFF00FF00 as int)) { super.visitLdcInsn(0xFFf5a623 as int); return }
                        if (v == (0xff0000 as int)) { super.visitLdcInsn(0xFFff5b6e as int); return }
                    }
                    super.visitLdcInsn(value)
                }
            }
            cuReader.accept(cuVisitor, 0)
            colorUtil.bytes = cuWriter.toByteArray()
        }

        // Rezippen
        def patchedJar = file("${cacheDir}/VulkanMod-patched.jar")
        ant.zip(destfile: patchedJar, basedir: unzipDir)

        // Als Resource kopieren
        ant.copy(file: patchedJar, tofile: vulkanRes)
    }
}
processResources.dependsOn vendorVulkanMod, sodiumTask, irisTask, berylTask,
        spotifyTask, flkTask, fabricApiTask, owoTask, modMenuTask,
        tpaTask, silkTask, clothConfigTask, chatHeadsTask

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
