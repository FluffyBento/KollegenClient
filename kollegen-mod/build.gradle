plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Discord Rich Presence (Minnced) – vendored locally (club.minnced sources
    // from java-discord-rpc v1.3.6 + JNA + native libs) since the original
    // artifact was only ever published to the now-defunct JCenter.
    implementation('dev.kollegen:discord-rpc:1.3.6') { transitive = false }
    include('dev.kollegen:discord-rpc:1.3.6') { transitive = false }

    // NOTE: Fabric Loom automatically registers the Mixin annotation processor
    // and generates the refmap. The refmap (kollegen.refmap.json) is maintained
    // manually in src/main/resources because Loom does not emit it for this setup.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(['version': project.version])
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
