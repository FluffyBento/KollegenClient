[package]
name = "kollegen-native"
version = "1.26.3"
edition = "2021"

[lib]
name = "kollegen_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
libc = "0.2"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
