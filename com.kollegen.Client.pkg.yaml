# Package-only Flatpak manifest: bündelt das bereits gebaute Kollegen-Client-Binary
# (target/release/kollegen-client) mitsamt der mitgelieferten Resources, anstatt im
# abgeschotteten Build-Sandbox neu zu kompilieren. Der Binary wird im linux-CI-Job
# (mit Netzwerkzugriff) gebaut und hier nur noch verpackt. Die GNOME-Runtime liefert
# WebKitGTK, gegen das der Tauri-Client linkt — dadurch wird der Whitescreen auf
# SteamDeck/SteamOS (fehlendes webkit2gtk-4.1) behoben.
#
# Die referenzierten Quellen werden von der CI vor dem Build in `_fpkg/` gestaged.
app-id: dev.kollegen.client
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: kollegen-client
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_FORCE_COMPOSITING_MODE=1
modules:
  - name: kollegen-client
    buildsystem: simple
    build-commands:
      - install -Dm755 _fpkg/kollegen-client /app/bin/kollegen-client
      - install -Dm644 _fpkg/resources/kollegen-client-mod.jar /app/bin/resources/kollegen-client-mod.jar
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.kollegen.client.png
      - install -Dm644 dev.kollegen.client.desktop /app/share/applications/dev.kollegen.client.desktop
      - install -Dm644 dev.kollegen.client.metainfo.xml /app/share/metainfo/dev.kollegen.client.metainfo.xml
    sources:
      - type: dir
        path: _fpkg
        dest: _fpkg
