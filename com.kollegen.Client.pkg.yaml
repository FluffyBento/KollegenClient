app-id: dev.kollegen.client
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: kollegen-client
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_FORCE_COMPOSITING_MODE=1
modules:
  - name: kollegen-client
    buildsystem: simple
    build-commands:
      - install -Dm755 _fpkg/kollegen-client /app/bin/kollegen-client
      - install -Dm644 _fpkg/resources/kollegen-client-mod.jar /app/bin/resources/kollegen-client-mod.jar
      - install -Dm644 _fpkg/icon.png /app/share/icons/hicolor/512x512/apps/dev.kollegen.client.png
      - install -Dm644 _fpkg/dev.kollegen.client.desktop /app/share/applications/dev.kollegen.client.desktop
    sources:
      - type: dir
        path: _fpkg
        dest: _fpkg
