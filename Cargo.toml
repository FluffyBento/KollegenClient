[package]
name = "kollegen-client"
version = "1.10.14"
description = "Kollegen Client | Minecraft-Client"
authors = ["FluffyBento"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
dirs = "6.0"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "0.6"
flate2 = "1.0"
image = "0.25"
tar = "0.4"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.21"
url = "2.5"
async-trait = "0.1"
rand = "0.8"
regex = "1.10"
lazy_static = "1.4"
sysinfo = "0.30"
discord-rich-presence = "1"
sanitize-filename = "0.6"
tempfile = "3.8"
open = "5"
gilrs = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
