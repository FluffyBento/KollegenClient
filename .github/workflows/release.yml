name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kollegen Client ${{ github.ref_name }}
          generate_release_notes: true

  flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtimes
        run: |
          flatpak --system install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: KollegenClient.flatpak
          manifest-path: com.kollegen.Client.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          build-args: --share=network

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "KollegenClient.flatpak"

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Windows installer (.exe)
        run: tauri build --config tauri.conf.json --bundles nsis

      - name: Rename installer to KollegenClient.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "KollegenClient.exe"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "KollegenClient.exe"
