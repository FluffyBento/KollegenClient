name: Release

on:
  push:
    tags:
      - 'v*'
      - '1.*'

permissions:
  contents: write

# Cancel any in-progress run for the same tag (e.g. when a tag is deleted and
# re-pushed) so we never build the same release twice in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove any existing release for this tag (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kollegen Client ${{ github.ref_name }}
          generate_release_notes: true

  build-mod:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Kollegen Client companion mod (Fabric)
        id: buildmod
        run: |
          cd kollegen-mod
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Publish companion mod jar (built or prebuilt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls kollegen-mod/build/libs/kollegen-client-mod-*.jar 2>/dev/null | head -n1 || true)
          if [ -z "$JAR" ] && [ -f kollegen-mod/kollegen-client-mod.jar ]; then
            JAR=kollegen-mod/kollegen-client-mod.jar
          fi
          if [ -n "$JAR" ]; then
            cp "$JAR" kollegen-client-mod.jar
            gh release upload "${{ github.ref_name }}" kollegen-client-mod.jar --clobber
            echo "Uploaded mod jar from: $JAR"
          else
            echo "No mod jar produced and none prebuilt; skipping mod upload."
          fi

  linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Bundle companion mod (build locally)
        run: |
          mkdir -p resources
          cd kollegen-mod && chmod +x ./gradlew && ./gradlew build --no-daemon && cd ..
          JAR=$(ls kollegen-mod/build/libs/kollegen-client-mod-*.jar 2>/dev/null | head -n1)
          if [ -n "$JAR" ]; then cp "$JAR" resources/kollegen-client-mod.jar; echo "Bundled $JAR"; else echo "Mod build failed"; exit 1; fi

      - name: Build Linux bundles (AppImage, RPM, DEB)
        run: tauri build --config tauri.conf.json --bundles appimage,rpm,deb

      - name: Organize release artifacts
        run: |
          mkdir -p release_artifacts
          cp target/release/bundle/appimage/*.AppImage release_artifacts/KollegenClient.AppImage || true
          cp target/release/bundle/rpm/*.rpm release_artifacts/KollegenClient.rpm || true
          cp target/release/bundle/deb/*.deb release_artifacts/KollegenClient.deb || true
          # updater signature for the AppImage
          cp target/release/bundle/appimage/*.AppImage.sig release_artifacts/KollegenClient.AppImage.sig || true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release_artifacts/*"

  flatpak:
    # DAU-freundlicher Vertrieb für SteamDeck/SteamOS: Das Flatpak bündelt die
    # GNOME-Runtime (inkl. WebKitGTK) und setzt die Whitescreen-Workarounds als
    # Env-Variablen. Keine manuell installierten Abhängigkeiten nötig.
    needs: [create-release]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and export Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.kollegen.Client.flatpak
          manifest-path: com.kollegen.Client.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish Flatpak to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "dev.kollegen.Client.flatpak"

  windows:
    needs: [create-release]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Bundle companion mod (build locally)
        shell: bash
        run: |
          mkdir -p resources
          cd kollegen-mod && chmod +x ./gradlew && ./gradlew build --no-daemon && cd ..
          JAR=$(ls kollegen-mod/build/libs/kollegen-client-mod-*.jar 2>/dev/null | head -n1)
          if [ -n "$JAR" ]; then cp "$JAR" resources/kollegen-client-mod.jar; echo "Bundled $JAR"; else echo "Mod build failed"; exit 1; fi

      - name: Build Windows installer (.exe)
        run: tauri build --config tauri.conf.json --bundles nsis

      - name: Rename installer + signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "KollegenClient.exe"
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "KollegenClient.exe.sig" }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KollegenClient.exe
            KollegenClient.exe.sig

  macos:
    needs: [create-release]
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (Intel + Apple Silicon)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Bundle companion mod (build locally)
        run: |
          mkdir -p resources
          cd kollegen-mod && chmod +x ./gradlew && ./gradlew build --no-daemon && cd ..
          JAR=$(ls kollegen-mod/build/libs/kollegen-client-mod-*.jar 2>/dev/null | head -n1)
          if [ -n "$JAR" ]; then cp "$JAR" resources/kollegen-client-mod.jar; echo "Bundled $JAR"; else echo "Mod build failed"; exit 1; fi

      # Two separate native builds instead of one universal binary: the universal
      # bundle caused install problems on Apple Silicon. Each arch gets its own
      # .app.tar.gz + .sig (for the updater) and its own .dmg.
      - name: Build macOS Apple Silicon bundles (aarch64)
        run: tauri build --config tauri.conf.json --target aarch64-apple-darwin --bundles app,dmg

      - name: Build macOS Intel bundles (x86_64)
        run: tauri build --config tauri.conf.json --target x86_64-apple-darwin --bundles app,dmg

      - name: Collect release artifacts
        run: |
          mkdir -p release_artifacts
          # Apple Silicon
          SRC_A="target/aarch64-apple-darwin/release/bundle"
          cp "$SRC_A"/dmg/*.dmg release_artifacts/KollegenClient-arm64.dmg 2>/dev/null || true
          APP_TAR_A=$(ls "$SRC_A"/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$APP_TAR_A" ]; then
            cp "$APP_TAR_A" release_artifacts/KollegenClient-aarch64.app.tar.gz
            [ -f "${APP_TAR_A}.sig" ] && cp "${APP_TAR_A}.sig" release_artifacts/KollegenClient-aarch64.app.tar.gz.sig
          fi
          # Intel
          SRC_I="target/x86_64-apple-darwin/release/bundle"
          cp "$SRC_I"/dmg/*.dmg release_artifacts/KollegenClient-x64.dmg 2>/dev/null || true
          APP_TAR_I=$(ls "$SRC_I"/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$APP_TAR_I" ]; then
            cp "$APP_TAR_I" release_artifacts/KollegenClient-x86_64.app.tar.gz
            [ -f "${APP_TAR_I}.sig" ] && cp "${APP_TAR_I}.sig" release_artifacts/KollegenClient-x86_64.app.tar.gz.sig
          fi
          ls -la release_artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release_artifacts/*"

  updater-manifest:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sigs
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "KollegenClient.AppImage.sig" \
            --pattern "KollegenClient.exe.sig" \
            --pattern "KollegenClient-aarch64.app.tar.gz.sig" \
            --pattern "KollegenClient-x86_64.app.tar.gz.sig" \
            --dir sigs || true
          ls -la sigs

      - name: Generate latest.json
        run: |
          TAG="${{ github.ref_name }}"
          TAG_RAW="${TAG#v}"
          if echo "$TAG_RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+v[0-9]+$'; then
            BASE_VER=$(echo "$TAG_RAW" | sed -E 's/v[0-9]+$//')
            BLD=$(echo "$TAG_RAW" | sed -E 's/.*v([0-9]+)$/\1/')
            MAJ=$(echo "$BASE_VER" | cut -d. -f1)
            MIN=$(echo "$BASE_VER" | cut -d. -f2)
            PAT=$(echo "$BASE_VER" | cut -d. -f3)
            if [ "$PAT" = "0" ]; then PAT="$BLD"; fi
            VERSION="$MAJ.$MIN.$PAT"
          else
            VERSION=$(echo "$TAG_RAW" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          fi
          echo "Resolved updater version: $VERSION"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LINUX_SIG=$(cat sigs/KollegenClient.AppImage.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat sigs/KollegenClient.exe.sig 2>/dev/null || echo "")
          MAC_SIG_A=$(cat sigs/KollegenClient-aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_SIG_I=$(cat sigs/KollegenClient-x86_64.app.tar.gz.sig 2>/dev/null || echo "")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Kollegen Client ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": { "signature": "${LINUX_SIG}", "url": "${BASE}/KollegenClient.AppImage" },
              "windows-x86_64": { "signature": "${WIN_SIG}", "url": "${BASE}/KollegenClient.exe" },
              "darwin-aarch64": { "signature": "${MAC_SIG_A}", "url": "${BASE}/KollegenClient-aarch64.app.tar.gz" },
              "darwin-x86_64": { "signature": "${MAC_SIG_I}", "url": "${BASE}/KollegenClient-x86_64.app.tar.gz" }
            }
          }
          EOF
          cat latest.json

      - name: Publish latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: "latest.json"
