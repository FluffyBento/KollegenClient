name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kollegen Client ${{ github.ref_name }}
          generate_release_notes: true

  flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtimes and SDK extensions
        run: |
          flatpak --system install -y org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          flatpak --system install -y org.freedesktop.Sdk.Extension.rust-stable
          flatpak --system install -y org.freedesktop.Sdk.Extension.node20

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kollegen-client.flatpak
          manifest-path: com.kollegen.Client.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64

      - name: Rename artifact
        run: mv kollegen-client.flatpak "kollegen-client-${{ github.ref_name }}.flatpak"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "kollegen-client-${{ github.ref_name }}.flatpak"

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows installer (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kollegen Client ${{ github.ref_name }}
          args: --bundles nsis
