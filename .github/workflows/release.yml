name: Release

on:
  push:
    tags:
      - 'v*'
      - '1.*'

permissions:
  contents: write

# Cancel any in-progress run for the same tag (e.g. when a tag is deleted and
# re-pushed) so we never build the same release twice in parallel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove any existing release for this tag (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kollegen Client ${{ github.ref_name }}
          generate_release_notes: true

  build-mod:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Kollegen Client companion mod (Fabric, best effort)
        id: buildmod
        continue-on-error: true
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: kollegen-mod
          arguments: build --stacktrace
          cache-disabled: true

      - name: Publish companion mod jar (built or prebuilt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls kollegen-mod/build/libs/kollegen-client-mod-*.jar 2>/dev/null | head -n1 || true)
          if [ -z "$JAR" ] && [ -f kollegen-mod/kollegen-client-mod.jar ]; then
            JAR=kollegen-mod/kollegen-client-mod.jar
          fi
          if [ -n "$JAR" ]; then
            cp "$JAR" kollegen-client-mod.jar
            gh release upload "${{ github.ref_name }}" kollegen-client-mod.jar --clobber
            echo "Uploaded mod jar from: $JAR"
          else
            echo "No mod jar produced and none prebuilt; skipping mod upload."
          fi

  linux:
    needs: [create-release, build-mod]
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Bundle companion mod (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resources
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "kollegen-client-mod.jar" --dir resources || \
          curl -fsSL --max-time 120 -o resources/kollegen-client-mod.jar "https://github.com/FluffyBento/KollegenClient/releases/latest/download/kollegen-client-mod.jar" || true

      - name: Build Linux bundles (AppImage, RPM, DEB)
        run: tauri build --config tauri.conf.json --bundles appimage,rpm,deb

      - name: Organize release artifacts
        run: |
          mkdir -p release_artifacts
          cp target/release/bundle/appimage/*.AppImage release_artifacts/KollegenClient.AppImage || true
          cp target/release/bundle/rpm/*.rpm release_artifacts/KollegenClient.rpm || true
          cp target/release/bundle/deb/*.deb release_artifacts/KollegenClient.deb || true
          # updater signature for the AppImage
          cp target/release/bundle/appimage/*.AppImage.sig release_artifacts/KollegenClient.AppImage.sig || true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release_artifacts/*"

  windows:
    needs: [create-release, build-mod]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Bundle companion mod (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir resources
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "kollegen-client-mod.jar" --dir resources || \
          curl -fsSL --max-time 120 -o resources/kollegen-client-mod.jar "https://github.com/FluffyBento/KollegenClient/releases/latest/download/kollegen-client-mod.jar" || true

      - name: Build Windows installer (.exe)
        run: tauri build --config tauri.conf.json --bundles nsis

      - name: Rename installer + signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "KollegenClient.exe"
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "KollegenClient.exe.sig" }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KollegenClient.exe
            KollegenClient.exe.sig

  macos:
    needs: [create-release, build-mod]
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets (Intel + Apple Silicon)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Bundle companion mod (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resources
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "kollegen-client-mod.jar" --dir resources || \
          curl -fsSL --max-time 120 -o resources/kollegen-client-mod.jar "https://github.com/FluffyBento/KollegenClient/releases/latest/download/kollegen-client-mod.jar" || true

      - name: Build macOS bundles (universal app + dmg + updater artifact)
        run: tauri build --config tauri.conf.json --target universal-apple-darwin --bundles app,dmg

      - name: Collect release artifacts
        run: |
          mkdir -p release_artifacts
          # Bei Universal-Builds landen die Bundles unter dem Target-Triple-Pfad.
          SRC="target/universal-apple-darwin/release/bundle"
          cp "$SRC"/dmg/*.dmg release_artifacts/ 2>/dev/null || true
          # Updater-Archiv + Signatur auf vorhersehbare Namen umbenennen, damit
          # der updater-manifest-Job sie wiederfindet.
          APP_TAR=$(ls "$SRC"/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$APP_TAR" ]; then
            cp "$APP_TAR" release_artifacts/KollegenClient.app.tar.gz
            if [ -f "${APP_TAR}.sig" ]; then
              cp "${APP_TAR}.sig" release_artifacts/KollegenClient.app.tar.gz.sig
            fi
          fi
          ls -la release_artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release_artifacts/*"

  updater-manifest:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sigs
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "KollegenClient.AppImage.sig" \
            --pattern "KollegenClient.exe.sig" \
            --pattern "KollegenClient.app.tar.gz.sig" \
            --dir sigs || true
          ls -la sigs

      - name: Generate latest.json
        run: |
          TAG="${{ github.ref_name }}"
          TAG_RAW="${TAG#v}"
          if echo "$TAG_RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+v[0-9]+$'; then
            BASE_VER=$(echo "$TAG_RAW" | sed -E 's/v[0-9]+$//')
            BLD=$(echo "$TAG_RAW" | sed -E 's/.*v([0-9]+)$/\1/')
            MAJ=$(echo "$BASE_VER" | cut -d. -f1)
            MIN=$(echo "$BASE_VER" | cut -d. -f2)
            PAT=$(echo "$BASE_VER" | cut -d. -f3)
            if [ "$PAT" = "0" ]; then PAT="$BLD"; fi
            VERSION="$MAJ.$MIN.$PAT"
          else
            VERSION=$(echo "$TAG_RAW" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          fi
          echo "Resolved updater version: $VERSION"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LINUX_SIG=$(cat sigs/KollegenClient.AppImage.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat sigs/KollegenClient.exe.sig 2>/dev/null || echo "")
          MAC_SIG=$(cat sigs/KollegenClient.app.tar.gz.sig 2>/dev/null || echo "")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Kollegen Client ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": { "signature": "${LINUX_SIG}", "url": "${BASE}/KollegenClient.AppImage" },
              "windows-x86_64": { "signature": "${WIN_SIG}", "url": "${BASE}/KollegenClient.exe" }
              $([ -n "$MAC_SIG" ] && echo ', "darwin-aarch64": { "signature": "'"$MAC_SIG"'", "url": "'"${BASE}/KollegenClient.app.tar.gz"'" }, "darwin-x86_64": { "signature": "'"$MAC_SIG"'", "url": "'"${BASE}/KollegenClient.app.tar.gz"'" }')
            }
          }
          EOF
          cat latest.json

      - name: Publish latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: "latest.json"
