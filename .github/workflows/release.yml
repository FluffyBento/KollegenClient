name: Release

on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure release exists (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --title "Kollegen Client ${{ github.ref_name }}" --generate-notes

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Kollegen Client ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

  build-mod-12111:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already published
        id: check_pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "^kollegen-client-mod-1.21.11.jar$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25 for MC 1.21.11 build
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Kollegen Client companion mod for MC 1.21.11 (Fabric)
        if: steps.check_pub.outputs.skip != 'true'
        id: buildmod_1_21_11
        run: |
          cd kollegen-mod
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=1.21.11 -Pfabric_version=0.141.2+1.21.11 -Ploader_version=0.16.9 -Pmod_version=1.24.0 -Parchives_base_name=kollegen-client-mod-1.21.11 -Pyarn_mappings=1.21.11+build.1

      - name: Publish 1.21.11 mod jar
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR12111=$(ls kollegen-mod/build/libs/kollegen-client-mod-1.21.11*.jar 2>/dev/null | head -n1)
          if [ -z "$JAR12111" ]; then echo "ERROR: no 1.21.11 jar built"; ls kollegen-mod/build/libs/; exit 1; fi
          cp "$JAR12111" kollegen-client-mod-1.21.11.jar
          for i in {1..3}; do
            gh release upload "${{ github.ref_name }}" kollegen-client-mod-1.21.11.jar --clobber && break
            echo "Upload attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Uploaded kollegen-client-mod-1.21.11.jar"

  build-mod-262:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already published
        id: check_pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "^kollegen-client-mod-26.2.jar$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25 for MC 26.2 build
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Kollegen Client companion mod for MC 26.2 (Fabric)
        if: steps.check_pub.outputs.skip != 'true'
        id: buildmod_26_2
        run: |
          cd kollegen-mod
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=26.2 -Pfabric_version=0.161.0+26.2 -Ploader_version=0.20.1 -Pmod_version=1.24.0 -Parchives_base_name=kollegen-client-mod-26.2

      - name: Publish 26.2 mod jar
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR262=$(ls kollegen-mod/build/libs/kollegen-client-mod-26.2*.jar 2>/dev/null | head -n1)
          if [ -z "$JAR262" ]; then echo "ERROR: no 26.2 jar built"; ls kollegen-mod/build/libs/; exit 1; fi
          cp "$JAR262" kollegen-client-mod-26.2.jar
          for i in {1..3}; do
            gh release upload "${{ github.ref_name }}" kollegen-client-mod-26.2.jar --clobber && break
            echo "Upload attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Uploaded kollegen-client-mod-26.2.jar"

  build-mod-263:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already published
        id: check_pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "^kollegen-client-mod-26.3.jar$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25 for MC 26.3 build
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Kollegen Client companion mod for MC 26.3 (Fabric)
        if: steps.check_pub.outputs.skip != 'true'
        id: buildmod_26_3
        run: |
          cd kollegen-mod
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=26.3 -Pfabric_version=0.161.0+26.3 -Ploader_version=0.20.1 -Pmod_version=1.24.0 -Parchives_base_name=kollegen-client-mod-26.3

      - name: Publish 26.3 mod jar
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR263=$(ls kollegen-mod/build/libs/kollegen-client-mod-26.3*.jar 2>/dev/null | head -n1)
          if [ -z "$JAR263" ]; then echo "ERROR: no 26.3 jar built"; ls kollegen-mod/build/libs/; exit 1; fi
          cp "$JAR263" kollegen-client-mod-26.3.jar
          for i in {1..3}; do
            gh release upload "${{ github.ref_name }}" kollegen-client-mod-26.3.jar --clobber && break
            echo "Upload attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Uploaded kollegen-client-mod-26.3.jar"

  linux:
    needs: [create-release, build-mod-12111, build-mod-262, build-mod-263]
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install dependencies
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm libudev-dev imagemagick desktop-file-utils squashfs-tools zsync

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download mod jars from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf resources
          mkdir -p resources
          for pattern in kollegen-client-mod-1.21.11.jar kollegen-client-mod-26.2.jar kollegen-client-mod-26.3.jar; do
            for attempt in 1 2 3 4 5; do
              if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "$pattern" --dir resources --clobber; then
                break
              fi
              echo "Download von $pattern fehlgeschlagen (Versuch $attempt), warte 30s"
              sleep 30
            done
            test -f "resources/$pattern" || { echo "$pattern fehlt weiterhin" >&2; exit 1; }
          done
          ls -la resources/

      - name: Set launcher version from tag
        run: bash scripts/set-version.sh "${{ github.ref_name }}"

      - name: Build Linux bundles (RPM, DEB)
        run: tauri build --config tauri.conf.json --bundles deb,rpm

      - name: Organize release artifacts
        run: |
          mkdir -p release_artifacts
          cp target/release/bundle/rpm/*.rpm release_artifacts/KollegenClient.rpm || true
          cp target/release/bundle/deb/*.deb release_artifacts/KollegenClient.deb || true

      - name: Build self-contained AppImage (bundled WebKit)
        run: |
          chmod +x scripts/build-appimage-webkit.sh
          scripts/build-appimage-webkit.sh \
            target/release/kollegen-client \
            release_artifacts/KollegenClient.AppImage

      - name: Sign AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            release_artifacts/KollegenClient.AppImage
          if [ -f release_artifacts/KollegenClient.AppImage.minisig ]; then
            mv release_artifacts/KollegenClient.AppImage.minisig release_artifacts/KollegenClient.AppImage.sig
          fi
          ls -la release_artifacts

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Stage package sources
        run: |
          mkdir -p _fpkg/resources
          install -m755 target/release/kollegen-client _fpkg/kollegen-client
          install -m644 resources/kollegen-client-mod-1.21.11.jar _fpkg/resources/kollegen-client-mod-1.21.11.jar
          install -m644 resources/kollegen-client-mod-26.2.jar _fpkg/resources/kollegen-client-mod-26.2.jar
          install -m644 resources/kollegen-client-mod-26.3.jar _fpkg/resources/kollegen-client-mod-26.3.jar
          install -m644 icons/icon.png _fpkg/icon.png
          install -m644 dev.kollegen.client.desktop _fpkg/dev.kollegen.client.desktop

      - name: Build Flatpak bundle
        run: |
          flatpak install -y --noninteractive --user flathub org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak-builder --force-clean --user --repo=flatpak-repo --install-deps-from=flathub flatpak-build-dir com.kollegen.Client.pkg.yaml
          flatpak build-bundle flatpak-repo dev.kollegen.Client.flatpak dev.kollegen.client
          ls -la dev.kollegen.Client.flatpak

      - name: Publish Linux artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release_artifacts/* dev.kollegen.Client.flatpak; do
            if [ -f "$f" ]; then
              for i in {1..3}; do
                gh release upload "${{ github.ref_name }}" "$f" --clobber && break
                echo "Upload attempt $i failed for $f, retrying in 5s..."
                sleep 5
              done
              echo "Uploaded $f"
            fi
          done

  windows:
    needs: [create-release, build-mod-12111, build-mod-262, build-mod-263]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already published
        id: check_pub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "^KollegenClient.exe.sig$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.check_pub.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        if: steps.check_pub.outputs.skip != 'true'
        run: npm install -g yarn

      - name: Install frontend dependencies
        if: steps.check_pub.outputs.skip != 'true'
        run: yarn install

      - name: Install NSIS
        if: steps.check_pub.outputs.skip != 'true'
        run: choco install nsis -y

      - name: Install Tauri CLI
        if: steps.check_pub.outputs.skip != 'true'
        run: npm install -g @tauri-apps/cli@^2

      - name: Set up Java 25
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download mod jars from release
        if: steps.check_pub.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf resources
          mkdir -p resources
          for pattern in kollegen-client-mod-1.21.11.jar kollegen-client-mod-26.2.jar kollegen-client-mod-26.3.jar; do
            for attempt in 1 2 3 4 5; do
              if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "$pattern" --dir resources --clobber; then
                break
              fi
              echo "Download von $pattern fehlgeschlagen (Versuch $attempt), warte 30s"
              sleep 30
            done
            test -f "resources/$pattern" || { echo "$pattern fehlt weiterhin" >&2; exit 1; }
          done
          ls -la resources/

      - name: Set launcher version from tag
        if: steps.check_pub.outputs.skip != 'true'
        run: bash scripts/set-version.sh "${{ github.ref_name }}"

      - name: Build Windows installers (.exe + .msi)
        if: steps.check_pub.outputs.skip != 'true'
        run: tauri build --config tauri.conf.json --bundles nsis msi

      - name: Rename installers + signatures
        if: steps.check_pub.outputs.skip != 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "KollegenClient.exe" }
          $sig = Get-ChildItem target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "KollegenClient.exe.sig" }
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "KollegenClient.msi" }
          $msiZip = Get-ChildItem target/release/bundle/msi/*.msi.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiZip) { Copy-Item $msiZip.FullName "KollegenClient.msi.zip" }
          $msiSig = Get-ChildItem target/release/bundle/msi/*.msi.zip.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiSig) { Copy-Item $msiSig.FullName "KollegenClient.msi.zip.sig" }
          Get-ChildItem KollegenClient* | Select-Object Name, Length

      - name: Publish Windows artifacts to GitHub Release
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for f in KollegenClient.exe KollegenClient.exe.sig KollegenClient.msi KollegenClient.msi.zip KollegenClient.msi.zip.sig; do
            if [ -f "$f" ]; then
              for i in {1..3}; do
                gh release upload "${{ github.ref_name }}" "$f" --clobber && break
                echo "Upload attempt $i failed for $f, retrying in 5s..."
                sleep 5
              done
              echo "Uploaded $f"
            fi
          done

  macos:
    needs: [create-release, build-mod-12111, build-mod-262, build-mod-263]
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already published
        id: check_pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q "^KollegenClient-x86_64.app.tar.gz.sig$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.check_pub.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (Intel + Apple Silicon)
        if: steps.check_pub.outputs.skip != 'true'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        if: steps.check_pub.outputs.skip != 'true'
        run: npm install -g yarn

      - name: Install frontend dependencies
        if: steps.check_pub.outputs.skip != 'true'
        run: yarn install

      - name: Install Tauri CLI
        if: steps.check_pub.outputs.skip != 'true'
        run: npm install -g @tauri-apps/cli@^2

      - name: Set up Java 25
        if: steps.check_pub.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download mod jars from release
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf resources
          mkdir -p resources
          for pattern in kollegen-client-mod-1.21.11.jar kollegen-client-mod-26.2.jar kollegen-client-mod-26.3.jar; do
            for attempt in 1 2 3 4 5; do
              if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "$pattern" --dir resources --clobber; then
                break
              fi
              echo "Download von $pattern fehlgeschlagen (Versuch $attempt), warte 30s"
              sleep 30
            done
            test -f "resources/$pattern" || { echo "$pattern fehlt weiterhin" >&2; exit 1; }
          done
          ls -la resources/

      - name: Set launcher version from tag
        if: steps.check_pub.outputs.skip != 'true'
        run: bash scripts/set-version.sh "${{ github.ref_name }}"

      - name: Build macOS Apple Silicon bundles (aarch64)
        if: steps.check_pub.outputs.skip != 'true'
        run: tauri build --config tauri.conf.json --target aarch64-apple-darwin --bundles app,dmg

      - name: Build macOS Intel bundles (x86_64)
        if: steps.check_pub.outputs.skip != 'true'
        run: tauri build --config tauri.conf.json --target x86_64-apple-darwin --bundles app,dmg

      - name: Collect release artifacts
        if: steps.check_pub.outputs.skip != 'true'
        run: |
          mkdir -p release_artifacts
          SRC_A="target/aarch64-apple-darwin/release/bundle"
          cp "$SRC_A"/dmg/*.dmg release_artifacts/KollegenClient-arm64.dmg 2>/dev/null || true
          APP_TAR_A=$(ls "$SRC_A"/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$APP_TAR_A" ]; then
            cp "$APP_TAR_A" release_artifacts/KollegenClient-aarch64.app.tar.gz
            [ -f "${APP_TAR_A}.sig" ] && cp "${APP_TAR_A}.sig" release_artifacts/KollegenClient-aarch64.app.tar.gz.sig
          fi
          SRC_I="target/x86_64-apple-darwin/release/bundle"
          cp "$SRC_I"/dmg/*.dmg release_artifacts/KollegenClient-x64.dmg 2>/dev/null || true
          APP_TAR_I=$(ls "$SRC_I"/macos/*.app.tar.gz 2>/dev/null | head -n1)
          if [ -n "$APP_TAR_I" ]; then
            cp "$APP_TAR_I" release_artifacts/KollegenClient-x86_64.app.tar.gz
            [ -f "${APP_TAR_I}.sig" ] && cp "${APP_TAR_I}.sig" release_artifacts/KollegenClient-x86_64.app.tar.gz.sig
          fi
          ls -la release_artifacts

      - name: Publish macOS artifacts to GitHub Release
        if: steps.check_pub.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in release_artifacts/*; do
            if [ -f "$f" ]; then
              for i in {1..3}; do
                gh release upload "${{ github.ref_name }}" "$f" --clobber && break
                echo "Upload attempt $i failed for $f, retrying in 5s..."
                sleep 5
              done
              echo "Uploaded $f"
            fi
          done

  updater-manifest:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sigs
          for sig in KollegenClient.AppImage.sig KollegenClient.exe.sig KollegenClient.msi.zip.sig \
                     KollegenClient-aarch64.app.tar.gz.sig KollegenClient-x86_64.app.tar.gz.sig; do
            for attempt in 1 2 3 4 5; do
              if gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
                   --pattern "$sig" --dir sigs --clobber; then
                break
              fi
              echo "Signatur $sig fehlt (Versuch $attempt), warte 20s"
              sleep 20
            done
          done
          ls -la sigs

      - name: Verify required signatures
        run: |
          missing=0
          for sig in KollegenClient.AppImage.sig KollegenClient.exe.sig \
                     KollegenClient-aarch64.app.tar.gz.sig KollegenClient-x86_64.app.tar.gz.sig; do
            if [ ! -s "sigs/$sig" ]; then
              echo "FEHLT: $sig" >&2
              missing=1
            else
              echo "ok: $sig"
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Updater-Manifest waere unbrauchbar - Release bitte erneut laufen lassen." >&2
            exit 1
          fi

      - name: Generate latest.json
        run: |
          TAG="${{ github.ref_name }}"
          TAG_RAW="${TAG#v}"
          if echo "$TAG_RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+v[0-9]+$'; then
            BASE_VER=$(echo "$TAG_RAW" | sed -E 's/v[0-9]+$//')
            BLD=$(echo "$TAG_RAW" | sed -E 's/.*v([0-9]+)$/\1/')
            MAJ=$(echo "$BASE_VER" | cut -d. -f1)
            MIN=$(echo "$BASE_VER" | cut -d. -f2)
            PAT=$(echo "$BASE_VER" | cut -d. -f3)
            if [ "$PAT" = "0" ]; then PAT="$BLD"; fi
            VERSION="$MAJ.$MIN.$PAT"
          else
            VERSION=$(echo "$TAG_RAW" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*$/\1/')
          fi
          # Auf drei Glieder bringen - Tauri verlangt volles Semver
          while [ "$(echo "$VERSION" | tr -cd '.' | wc -c)" -lt 2 ]; do
            VERSION="${VERSION}.0"
          done
          echo "Resolved updater version: $VERSION"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LINUX_SIG=$(cat sigs/KollegenClient.AppImage.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat sigs/KollegenClient.exe.sig 2>/dev/null || echo "")
          MAC_SIG_A=$(cat sigs/KollegenClient-aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_SIG_I=$(cat sigs/KollegenClient-x86_64.app.tar.gz.sig 2>/dev/null || echo "")
          MSI_SIG=$(cat sigs/KollegenClient.msi.zip.sig 2>/dev/null || echo "")
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Kollegen Client ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": { "signature": "${LINUX_SIG}", "url": "${BASE}/KollegenClient.AppImage" },
              "windows-x86_64": { "signature": "${WIN_SIG}", "url": "${BASE}/KollegenClient.exe" },
              "darwin-aarch64": { "signature": "${MAC_SIG_A}", "url": "${BASE}/KollegenClient-aarch64.app.tar.gz" },
              "darwin-x86_64": { "signature": "${MAC_SIG_I}", "url": "${BASE}/KollegenClient-x86_64.app.tar.gz" }
            }
          }
          EOF
          cat latest.json

      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for i in {1..3}; do
            if gh release upload "${{ github.ref_name }}" latest.json --clobber \
                 --repo "${{ github.repository }}"; then
              ok=1
              break
            fi
            echo "Upload attempt $i failed for latest.json, retrying in 5s..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "latest.json konnte nicht hochgeladen werden - Auto-Update waere tot." >&2
            exit 1
          fi
          echo "Uploaded latest.json"